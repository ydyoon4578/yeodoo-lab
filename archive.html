<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>전략 랩으로 이동합니다</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232A2621'/%3E%3Cpath d='M6 22 L13 15 L18 19 L26 8' fill='none' stroke='%23FFBC00' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='26' cy='8' r='2.4' fill='%23FFBC00'/%3E%3C/svg%3E">
<link rel="canonical" href="https://ydyoon4578.github.io/yeodoo-lab/explorer.html">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0F141A;color:#EAEEF2;
       font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.7;padding:24px}
  @media(prefers-color-scheme:light){body{background:#F5F7FA;color:#1B2733}}
  .b{max-width:520px;text-align:center;font-size:14px}
  .b b{display:block;font-size:19px;margin-bottom:10px}
  .b a{color:#FFBC00}
  @media(prefers-color-scheme:light){.b a{color:#8A6B00}}
  .b p{color:#8A97A3;font-size:12.5px;margin-top:14px}
</style>
</head>
<body>
<div class="b">
  <b>전략 랩으로 합쳤습니다</b>
  기각 아카이브(전략 랩)와 백테스트 원장을 한 페이지로 통합했습니다(2026-07-26).
  <p>자동으로 이동하지 않으면 <a id="go" href="explorer.html">여기를 누르세요</a>.</p>
</div>
<script>
/* 기존 딥링크 보존 — #s-<sid>는 explorer 의 부팅 로직이 알아서 연다.
   해시가 없으면 기각 원장(#archledger)으로 보낸다. 이 주소를 저장해 둔 사람이
   찾던 것이 그것이기 때문이다.
   ⚠ 전에는 '#view=runs' 였다 — 그 탭은 2554b44 에서 폐지됐고 explorer 의 해시
     처리기는 '#s-' 만 받으므로, 이 폴백은 그냥 페이지 맨 위로 떨어지고 있었다. */
(function(){
  var h = location.hash || '';
  var url = 'explorer.html' + (h || '#archledger');
  var a = document.getElementById('go');
  if (a) a.href = url;
  location.replace(url);
})();
</script>
</body>
</html>
