<!-- SHELLFONT:BEGIN --><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><!-- SHELLFONT:END -->
<style>
  :root{
    --ground:#F5F7FA;--panel:#FFFFFF;--panel-2:#EEF2F6;--line:#DCE3EA;--line-soft:#E9EEF3;
    --ink:#1B2733;--ink-2:#42505E;--muted:#646B74;--accent:#816400;--gA:#158A52;--gB:#4F9A54;--gC:#B0870F;--gD:#C2600F;--gF:#A64B3B;--rej:#A64B3B;--rej-bg:#f3e0db;
    --shadow:0 1px 2px rgba(23,39,51,.05),0 8px 24px -12px rgba(23,39,51,.18);
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0F141A;--panel:#181E26;--panel-2:#20272F;--line:#2E3742;--line-soft:#242C34;
    --ink:#EAEEF2;--ink-2:#C4CDD6;--muted:#8A97A3;--accent:#FFBC00;--gA:#2FBE77;--gB:#5FB06A;--gC:#D6A537;--gD:#E5893C;--gF:#E5806A;--rej:#E5806A;--rej-bg:#2c1815;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
  }}
  :root[data-theme="light"]{--ground:#F5F7FA;--panel:#FFFFFF;--panel-2:#EEF2F6;--line:#DCE3EA;--line-soft:#E9EEF3;--ink:#1B2733;--ink-2:#42505E;--muted:#646B74;--accent:#816400;--gA:#158A52;--gB:#4F9A54;--gC:#B0870F;--gD:#C2600F;--gF:#A64B3B;--rej:#A64B3B;--rej-bg:#f3e0db;--shadow:0 1px 2px rgba(23,39,51,.05),0 8px 24px -12px rgba(23,39,51,.18);}
  :root[data-theme="dark"]{--ground:#0F141A;--panel:#181E26;--panel-2:#20272F;--line:#2E3742;--line-soft:#242C34;--ink:#EAEEF2;--ink-2:#C4CDD6;--muted:#8A97A3;--accent:#FFBC00;--gA:#2FBE77;--gB:#5FB06A;--gC:#D6A537;--gD:#E5893C;--gF:#E5806A;--rej:#E5806A;--rej-bg:#2c1815;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);}
  /* 폭 토큰 — 넓은 표/본문형/읽기형 세 가지로 통일(페이지 이동 시 폭이 튀지 않게) */
  /* 폭 토큰은 셸이 보장한다(build/sync_shell.py) — 페이지 사본은 2026-08-10 에 걷어냈다.
     사본이 1440 으로 남아 있었는데 셸은 1680 이었다. 지금은 셸이 뒤에 와서 셸이 이기지만,
     CSS 순서가 바뀌면 조용히 뒤집힌다. 같은 값을 두 곳에 두지 않는다. */
  *,*::before,*::after{box-sizing:border-box}
  /* 본문 글꼴: 맑은 고딕 우선. Segoe UI에는 한글 글리프가 없어 한글은 어차피 맑은 고딕으로
     떨어졌고, 영문만 Segoe UI로 갈렸다 — 한 글꼴로 통일한다. 숫자·차트 라벨은 고정폭(--mono)
     유지: 맑은 고딕은 가변폭이라 적합도·수익률 열이 어긋난다. */
  :root{--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",monospace;--sans:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  /* keep-all은 한글 단어를 안 쪼개려고 넣은 것인데, 끊을 곳 없는 라틴 문자열
     (예: "(Goldilocks·Recovery·…·Recession)" 527px)까지 통째로 붙들어 모바일에서 페이지를
     가로로 밀어냈다. overflow-wrap:break-word는 **넘칠 때만** 끊으므로 한글 단어 보전은 유지된다. */
  .wrap{max-width:var(--w-base);margin:0 auto;padding:0 20px 70px}
  header.mast{padding:64px 0 18px;border-bottom:1px solid var(--line)}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:12px}
  .eyebrow::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}
  h1.title{font-family:var(--mono);font-weight:600;font-size:clamp(23px,4vw,32px);line-height:1.14;letter-spacing:-.01em;margin:14px 0 0}
  .lede{margin:12px 0 0;max-width:76ch;font-size:15px;color:var(--ink-2)} .lede b{color:var(--ink)}
  .statline{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px 10px;font-family:var(--mono);font-size:12px}
  .stat{display:inline-flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:4px 12px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:14px;font-weight:600}
  .rej.hl{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 26%,transparent)}
  .rej{scroll-margin-top:24px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--rej);border-radius:2px;padding:11px 15px;margin-bottom:8px;box-shadow:var(--shadow)}
  .rej .rn{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .rej .xb{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--rej);background:var(--rej-bg);border-radius:2px;padding:1px 6px}
  .rej .rr{margin-top:5px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
  /* 재검 부기 — 기각 항목 안에 접혀 있고, 배포 전략 카드(탐색기)와 색·틀이 겹치지 않게 무채색으로 둔다.
     강조색을 쓰면 '살아난 전략'으로 읽히므로 --accent 계열은 여기서 쓰지 않는다. */
  .ab{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
  .ab summary{cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted);list-style:none;padding:2px 0}
  .ab summary::-webkit-details-marker{display:none}
  .ab summary::before{content:"▸ ";color:var(--muted)}
  .ab[open] summary::before{content:"▾ "}
  .ab summary b{color:var(--rej)}
  a.home,button.theme{position:fixed;top:14px;z-index:50;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);box-shadow:var(--shadow);border-radius:2px;cursor:pointer}
  button.theme{right:14px;width:38px;font-size:16px}
  a.home:hover,button.theme:hover{border-color:var(--accent)}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11.5px;line-height:1.8}
  footer a{color:var(--accent);text-decoration:none}
  /*a11y-fixes*/
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .fchip[aria-pressed="true"]{color:var(--ground)}}
  :root[data-theme="dark"] .fchip[aria-pressed="true"]{color:var(--ground)}
  a:focus-visible,button:focus-visible,input:focus-visible,[role="option"]:focus-visible,.fchip:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /*touch-targets*/
  @media(pointer:coarse){.fchip,.cbtn,.sortbtn,.item,.cbtn,.pill{min-height:40px}.fchip{padding-top:8px;padding-bottom:8px}}
  /*reduced-motion*/
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

  /* ── 전략 실험실(2026-07-25 재구성) ─────────────────────────────── */
  .statline{margin:20px 0 0;display:flex;gap:9px;flex-wrap:wrap}
  .statline .stat{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--line);
    border-radius:2px;padding:10px 14px;min-width:118px;box-shadow:var(--shadow)}
  .statline .stat b{display:block;font-family:var(--mono);font-size:21px;font-weight:800;line-height:1.1}
  .statline .stat em{display:block;margin-top:4px;font-style:normal;font-size:11.5px;color:var(--muted)}
  .statline .stat{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  /* 값은 대문자화에서 뺀다 — |t|(t통계량)가 |T|로 바뀌면 다른 기호가 된다 */
  .statline .stat b{text-transform:none}
  .statline .stat.ok{border-top-color:var(--good,#0E8A54)}
  .statline .stat.zero{border-top-color:var(--hot)}
  /* 상단 내비·테마 토글 CSS는 build/sync_nav.py가 넣는 NAVCSS 블록이 담당한다.
     여기서 중복 정의하면 23장이 서로 어긋난다 — 이 페이지에서는 건드리지 않는다. */
  .dupbox{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:2px;
          padding:13px 15px;margin:0 0 18px;font-size:13px;line-height:1.6;color:var(--ink-2)}
  .dupbox b{color:var(--ink)}
  .dupbox table{width:100%;border-collapse:collapse;margin-top:9px;font-family:var(--mono);font-size:11.5px}
  .dupbox td{padding:4px 6px;border-top:1px solid var(--line-soft);vertical-align:top}
  .dupbox td.c{width:56px;color:var(--hot);font-weight:700;white-space:nowrap}
  .dupbox .dn{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55}
  .hardnote{background:var(--panel-2);border:1px solid var(--line-soft);border-left:3px solid var(--hot);
    border-radius:2px;padding:13px 17px;margin:20px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.75}
  .hardnote b{color:var(--ink)}
  .sech{font-family:var(--mono);font-size:13px;font-weight:800;margin:38px 0 4px;display:flex;align-items:baseline;gap:9px}
  .sech span{font-size:11px;font-weight:600;color:var(--muted)}
  .sechn{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.65}
  .frow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .chip{font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;border:1px solid var(--line);
    border-radius:2px;background:var(--ground);color:var(--ink-2);cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#FFF}
  @media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#131820}}
  :root[data-theme="dark"] .chip[aria-pressed=true]{color:#131820}
  .chip .cn{font-weight:500;opacity:.7;margin-left:5px}

  .rcard{background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow);
    padding:15px 18px;margin-bottom:12px}
  .rtop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .rtop h3{margin:0;font-size:14.5px;font-weight:700;flex:1}
  .rkind{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);
    border:1px solid var(--line);border-radius:2px;padding:1px 6px}
  .rv{font-family:var(--mono);font-size:11px;font-weight:800;border-radius:2px;padding:2px 8px;border:1px solid}
  .rv.vpass{color:var(--good,#0E8A54);border-color:currentColor}
  .rv.vunv{color:var(--muted);border-color:var(--line)}
  .rv.vrej{color:var(--hot);border-color:currentColor}
  .rrule{margin:9px 0 0;font-size:12.5px;color:var(--ink);line-height:1.65}
  .rwhy{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6}
  /* 🚨 격자선은 자식의 테두리로 그린다(2026-08-11). 종전에는 gap:1px 이 부모 배경을
     비추게 했는데, dpr 이 1 이 아니면(브라우저 90% 확대 등) 그 간격이 0.89 device px 가
     되고 양쪽 자식이 바깥으로 스냅되면 선이 **통째로 사라진다**. 일정 캘린더에서 실제로
     그랬다 — 바깥 테두리만 남고 안쪽 격자가 군데군데 비었다.
     컨테이너는 왼쪽·위만, 자식은 오른쪽·아래만 — 열 수가 동적이어도(auto-fit) 겹치지 않는다. */
  .rgrid{margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));
    border-left:1px solid var(--line-soft);border-top:1px solid var(--line-soft);border-radius:2px;overflow:hidden}
  .rgrid>*{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
  .rc{background:var(--panel);padding:7px 10px}
  .rc span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .rc.tstat span{text-transform:none}   /* 위와 같은 이유 — t통계량 라벨은 소문자여야 한다 */
  .rc b{display:block;margin-top:2px;font-family:var(--mono);font-size:13px;font-weight:800}
  .rc.up b{color:var(--good,#0E8A54)} .rc.dn b{color:var(--hot)}
  .spark{display:block;width:100%;height:44px;margin:11px 0 0}
  .rbench{margin:6px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .rarch{margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);line-height:1.6}
  .rarch b{color:var(--ink-2)}
  .ncard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);
    border-radius:2px;padding:12px 16px;margin-bottom:9px}
  .rcard.hit,.ncard.hit{outline:2px solid var(--accent);outline-offset:3px}
  .ncard h4{margin:0;font-size:13px;font-weight:700;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .rcard.hit,.ncard.hit{outline:2px solid var(--accent);outline-offset:3px}
  .ncard h4 span{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);margin-left:auto}
  .ncard p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.65}
  /* ── 지표별 타이밍 신호 ─────────────────────────────────────────────── */
  header.mast h1{margin:8px 0 0;font-size:clamp(30px,4.6vw,50px);line-height:1.12;letter-spacing:-.02em;font-weight:800}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .lede{margin:14px 0 0;max-width:var(--w-read);color:var(--ink-2);font-size:15.5px}
  .statline{margin:20px 0 0;display:flex;gap:9px;flex-wrap:wrap}
  .stat{display:inline-flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
        border-radius:2px;padding:10px 14px;min-width:112px;box-shadow:var(--shadow);
        font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .stat b{text-transform:none;font-size:21px;color:var(--ink);letter-spacing:-.01em;line-height:1.2}
  .stat em{text-transform:none;letter-spacing:0;font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
  .stat.ok b{color:var(--gA)} .stat.zero b{color:var(--rej)}
  .hardnote{background:var(--panel-2);border:1px solid var(--line-soft);border-left:3px solid var(--rej);
            border-radius:2px;padding:13px 16px;margin:22px 0 0;font-size:13px;line-height:1.68;color:var(--ink-2)}
  .hardnote b{color:var(--ink)}
  .sech{margin:44px 0 0;font-size:19px;font-weight:800;letter-spacing:-.01em;
        padding-left:11px;border-left:3px solid var(--accent)}
  .sech span{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);margin-left:8px}
  .sechn{margin:9px 0 0;max-width:var(--w-read);font-size:13px;color:var(--muted);line-height:1.65}

  /* 포트폴리오 카드 */
  .pfgrid{margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .pfc{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:15px 16px;box-shadow:var(--shadow)}
  .pfc h3{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
  .pfc .pfr{margin:7px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.6}
  .pfc .pfw{margin:7px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6}
  /* 🚨 격자선은 자식의 테두리로 그린다(2026-08-11). 종전에는 gap:1px 이 부모 배경을
     비추게 했는데, dpr 이 1 이 아니면(브라우저 90% 확대 등) 그 간격이 0.89 device px 가
     되고 양쪽 자식이 바깥으로 스냅되면 선이 **통째로 사라진다**. 일정 캘린더에서 실제로
     그랬다 — 바깥 테두리만 남고 안쪽 격자가 군데군데 비었다.
     컨테이너는 왼쪽·위만, 자식은 오른쪽·아래만 — 열 수가 동적이어도(auto-fit) 겹치지 않는다. */
  .pfg{margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));

/* ── 공통 셸 v1 — build/sync_shell.py 생성. 이 블록은 직접 고치지 말 것 ──────────────
   23장이 각자 스타일 블록을 들고 있어 공통 양식을 넣을 자리가 첫 블록 맨 끝밖에 없다.
   같은 특이도면 뒤가 이기므로 페이지 셸 규칙만 덮어쓰고 고유 컴포넌트는 건드리지 않는다.
   ⚠ 이 블록 안에 스타일 종료 태그를 글자 그대로 쓰면 안 된다 — HTML 파서는 주석 안이든
      아니든 그 지점에서 style 요소를 끝내버린다(실제로 한 번 밟았다). */

/* ① 글꼴 — Pretendard.
   기존 스택 첫 후보는 "Malgun Gothic"이었다. 윈도 기본 한글 글꼴이라 굵기가 사실상 400/700
   두 단계뿐이고 맥에서는 Apple SD Gothic Neo로 떨어져, 같은 화면이 OS마다 다른 글꼴로 보였다.
   Pretendard는 100~900 가변에 라틴·숫자가 Inter 계열이라 한글과 숫자가 한 글꼴로 붙는다.
   --mono의 한글 후보도 Pretendard로 바꾼다 — 고정폭이 필요한 건 숫자뿐인데, 한글까지 고정폭
   스택으로 떨어뜨리면 본문과 다른 글꼴이 한 줄 안에서 섞인다. */
:root{
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",monospace;
  /* 폭 토큰 — 페이지를 옮겨 다닐 때 본문 폭이 튀지 않게 하는 값이다. 21장은 각자 갖고 있었지만
     stocks.html은 max-width:var(--w-wide)를 쓰면서 정의를 안 갖고 있어 폭 제한 없이 퍼져 있었다.
     이런 건 페이지마다 챙길 것이 아니라 셸이 보장할 것이다.
     🚨 2026-08-10 — --w-wide 를 1440 → 1680 으로 올렸다(사용자 요청 '화면을 최대한 넓게').
       홈은 자료 화면이다. 종목 히트맵이 518칸을 그리는데 폭이 곧 읽히는 종목 수다 —
       1200px 에서는 가장 작은 칸이 7×10px 라 글자가 안 들어갔다.
       ⚠ 내비(.topnav .nvin)도 이 토큰을 쓴다. 본문만 넓히면 내비보다 본문이 넓어져
         화면이 어긋나 보인다 — 그래서 페이지가 아니라 여기서 바꾼다.
       ⚠ --w-read(980)는 그대로다. 글이 주인 화면은 한 줄이 길어지면 읽기 나빠진다 —
         넓게 쓰는 것과 아무 데나 늘리는 것은 다르다. */
  --w-wide:1680px;--w-base:1200px;--w-read:980px;
}

/* ② 중립색 — 라이트는 중립 회색, 다크는 터미널 계열. 의미색(accent·deploy·국면·심리 계열)은
   손대지 않는다. 대비는 sync_shell.py의 check_contrast()가 배포 전에 검사한다.
   ⚠ 주석에 별표와 빗금이 붙은 토큰명을 그대로 쓰면 거기서 주석이 닫힌다(밟았다). */
:root{--ground:#FBFAF7;--panel:#FBFAF7;--panel-2:#F2F0EB;--line:#D8D6D0;--line-soft:#EDEBE6;--ink:#111418;--ink-2:#3E444B;--muted:#5F656D;--shadow:none;--hot:#A3352A;--marg:#7E5200;--deploy:#0A7040;--accent:#0A5697;}
@media(prefers-color-scheme:dark){:root{--ground:#0C0E11;--panel:#0C0E11;--panel-2:#161A1F;--line:#252A30;--line-soft:#1A1E23;--ink:#DEE3E8;--ink-2:#AEB6BE;--muted:#949DA6;--shadow:none;--hot:#E8887A;--marg:#DFAE55;--deploy:#4BD08D;--accent:#6FB6EA;}}
:root[data-theme="light"]{--ground:#FBFAF7;--panel:#FBFAF7;--panel-2:#F2F0EB;--line:#D8D6D0;--line-soft:#EDEBE6;--ink:#111418;--ink-2:#3E444B;--muted:#5F656D;--shadow:none;--hot:#A3352A;--marg:#7E5200;--deploy:#0A7040;--accent:#0A5697;}
:root[data-theme="dark"]{--ground:#0C0E11;--panel:#0C0E11;--panel-2:#161A1F;--line:#252A30;--line-soft:#1A1E23;--ink:#DEE3E8;--ink-2:#AEB6BE;--muted:#949DA6;--shadow:none;--hot:#E8887A;--marg:#DFAE55;--deploy:#4BD08D;--accent:#6FB6EA;}

/* ③ 타이포 — 한글에 고정폭·대문자변환·자간을 걸던 것을 되돌린다.
   한글은 대소문자가 없어 text-transform:uppercase가 무의미하고(라틴만 바뀐다), 자간 .1~.2em은
   음절을 벌려 읽기를 방해한다. 실제로 이 규칙 때문에 통계량 |t|가 화면에서 |T|로 찍힌 적이 있다. */
body{font-family:var(--sans);letter-spacing:-.003em}

   한 제목 안에 두 글꼴이 섞인다("… RP 통합 (Multi-Sleeve Core)"가 그렇게 보였다).
   작은 머리글(h4 등)은 라틴 약어가 대부분이라 그대로 둔다.
   :not(._)은 특이도를 페이지 규칙(.dtop h2 같은 것)과 맞추려고 붙였다 — 요소 선택자만으로는

:is(h1,h2):not(._){font-family:var(--sans);letter-spacing:-.025em}

/* ④ 숫자 — 자릿수가 흔들리면 세로로 비교할 수 없다. 표·지표값은 전부 고정폭 숫자로. */

/* ⑥ 잔손질 — 키보드 초점 링(전엔 브라우저 기본에 맡겨 다크에서 안 보였다), 선택색, 얇은 스크롤바 */

/* ⑦ 장식 걷기 (2026-08-09) — 사용자 지적 "클로드 특유의 인터페이스 구성방식".
   그 인상의 정체는 색만이 아니다. **떠 있는 둥근 카드**와 **알약 배지**가 나머지 몫이다.
   팔레트는 위에서 바꿨고 여기서 형태를 걷는다.

   🚨 범위를 좁게 잡는다. 페이지마다 컴포넌트가 다르고, 전부에 border-radius:0 을 걸면
     입력창·버튼까지 각져 오히려 쓰기 나빠진다. **떠 보이게 하는 것**만 끈다:
       · box-shadow — 토큰(--shadow:none)으로 이미 죽지만, 값을 손으로 박은 자리가 남아 있다
       · 큰 모서리(2px 이상) — 카드가 카드처럼 보이는 반경. 작은 반경(칩·입력)은 둔다

  /* 배지 색은 자체 토큰으로 들고 간다 — 페이지마다 --deploy/--marg/--champ 보유가 달라
     (잠금 래퍼 4장엔 없다) 페이지 팔레트에 기대면 22장에서 다르게 보인다. */
  :root{--nv-pass:#0E8A54;--nv-marg:#B25E12;--nv-unv:#66757F;--nv-rej:#A64B3B;--nv-soon:#2C6E8F}
  @media(prefers-color-scheme:dark){:root{--nv-pass:#38D083;--nv-marg:#F0863C;--nv-unv:#8A97A3;--nv-rej:#E5806A;--nv-soon:#6BB0D6}}
  :root[data-theme="light"]{--nv-pass:#0E8A54;--nv-marg:#B25E12;--nv-unv:#66757F;--nv-rej:#A64B3B;--nv-soon:#2C6E8F}
  :root[data-theme="dark"]{--nv-pass:#38D083;--nv-marg:#F0863C;--nv-unv:#8A97A3;--nv-rej:#E5806A;--nv-soon:#6BB0D6}
  .skiplink{position:absolute;left:-9999px;top:0;z-index:100;background:var(--panel);color:var(--ink);

          border-bottom:1px solid var(--line)}
  .topnav .nvin{max-width:var(--w-wide,1440px);margin:0 auto;padding:0 20px;height:52px;
                display:flex;align-items:center;gap:10px}

                 font-size:15px;color:var(--ink);text-decoration:none;letter-spacing:-.01em;flex:none}

                 background:none;border:0;cursor:pointer;padding:7px 9px;border-radius:2px;white-space:nowrap;
                 display:inline-flex;align-items:center;gap:3px}
  .navcat>button:hover{background:var(--panel-2);color:var(--accent)}
  .navcat>button[aria-expanded="true"]{background:var(--panel-2);color:var(--accent)}
  .navcat.on>button{color:var(--accent)}
  .navcat.on>button::after{content:"";position:absolute;left:9px;right:9px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
  .navcat .cv{font-size:11px;opacity:.55;transition:transform .12s}
  .navcat>button[aria-expanded="true"] .cv{transform:rotate(180deg)}

  .mmpanel{position:absolute;top:calc(100% + 5px);left:0;min-width:320px;max-width:min(560px,92vw);
           background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow);
           padding:7px;z-index:70}
  .mmpanel[hidden]{display:none}
  /* 🚨 네 카테고리 모두 버튼 왼쪽 끝에서 **오른쪽으로** 편다. 전에는 마지막 둘만
     `:last-child,:nth-last-child(2){left:auto;right:0}` 로 뒤집었다 — 그 규칙은 틀렸던 게
     아니라 **자기 레이아웃보다 오래 살아남았다**. 메가메뉴는 10칸으로 출발했고(2026-07-25)
     그때 마지막 두 칸은 바 오른쪽 끝에 있어서 오른쪽 정렬이 실제로 넘침을 막고 있었다.
     이후 10→6(2026-07-25)→5(748cbf58 공시 탭)→4(741fbe1d 가치 탭, 2026-08-12)로 줄면서
     버튼이 왼쪽으로 밀려왔는데 규칙은 따라오지 않았다. 위치 선택자가 집는 대상은 그대로인데
     그 대상이 서 있는 자리가 바뀐 것이다.
     실측(뷰포트 1442px · 버튼 한 칸 55px): 5칸일 때 전략 패널은 x=38 에서 시작해 멀쩡했다.
     가치 탭이 빠져 4칸이 되자 딱 한 칸만큼 왼쪽으로 밀려 38−55 = x=−17 — 뷰포트 밖에서 잘렸다.
     사용자가 "왼쪽이 살짝 잘린다"고 한 그 17px 이고, 오늘 생긴 회귀다.
     왼쪽 정렬은 안전하다. 패널 실폭은 min-width 320px 로 고정이고(내용이 그 안에 들어가
     max-width 560px 까지 가지 않는다) 가장 오른쪽 패널의 오른쪽 끝은 x=624 로 **뷰포트 폭이
     변해도 그대로다** — nvin 이 max-width:1440 중앙정렬이라 폭이 줄면 여백만 사라지고 내용
     시작점은 padding 20px 에 남기 때문이다. 데스크톱 하한 1101px 에서도 여유 477px
     (1101·1200·1366·1440 네 폭 실측 넘침 0). 1100px 이하는 드로어라 이 규칙과 무관하다.
     ⚠ 칸을 다시 늘리면 이 계산이 깨진다. 그때도 위치 선택자로 되돌리지 마라 — 칸 수가 바뀌면
     또 조용히 엉뚱한 자리를 집는다. 넘치는 그 패널을 지목해서 다뤄야 한다. */
  /* 설명 줄을 걷어내 한 줄짜리가 됐다 — 세로 여백을 줄여 목록이 촘촘히 읽히게 한다. */
  .mmi{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:baseline;
       padding:7px 10px;border-radius:2px;text-decoration:none;color:inherit}

  .mmi[aria-current="page"]{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .mmi[aria-current="page"] .mmn{color:var(--accent)}
  span.mmi{cursor:default}
  span.mmi .mmn{color:var(--muted);font-weight:600}
  .mmb{font-family:var(--sans);font-size:11px;font-weight:700;border-radius:2px;padding:2px 6px;white-space:nowrap;
       border:1px solid color-mix(in srgb,var(--mmc,var(--muted)) 40%,transparent);
       background:color-mix(in srgb,var(--mmc,var(--muted)) 12%,transparent);color:var(--mmc,var(--muted))}
  .mmb.vpass{--mmc:var(--nv-pass)} .mmb.vmarg{--mmc:var(--nv-marg)}
  .mmb.vunv{--mmc:var(--nv-unv)}   .mmb.vrej{--mmc:var(--nv-rej)}
  .mmb.soon{--mmc:var(--nv-soon)}  .mmb.wont{--mmc:var(--nv-unv)}
  .mmlk{font-size:11px;opacity:.6;margin-left:3px;vertical-align:1px}

  .asofchip{display:none;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
            color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:2px;
            padding:4px 9px;white-space:nowrap;flex:none}
  .asofchip:hover{border-color:var(--accent);color:var(--accent)}
  .asofchip .ac1{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .asofchip.stale{border-color:var(--hot);color:var(--hot)}
  .asofchip.ready{display:inline-flex}
  .themebtn{width:32px;height:32px;border-radius:2px;border:1px solid var(--line);background:var(--panel);
            color:var(--ink-2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;
            justify-content:center;flex:none}
  .themebtn:hover{border-color:var(--accent)}
  .navtoggle{display:none;width:34px;height:32px;border-radius:2px;border:1px solid var(--line);
             background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:15px;align-items:center;
             justify-content:center;flex:none}

  /* ── 모바일: 카테고리 줄을 드로어로 접는다 ───────────────────────────── */
  @media(max-width:1100px){
    /* ⚠ backdrop-filter를 반드시 끈다 — 장식이 아니라 **레이아웃 버그의 원인**이다.
       filter·backdrop-filter·transform이 걸린 요소는 자손 position:fixed의 컨테이닝 블록이
       된다(뷰포트가 아니라). 아래 .navcats는 fixed 드로어인데 .topnav(높이 52px)가 기준이 되면
       top:52px·bottom:0이 52px짜리 상자 안에서 계산돼 **드로어 높이가 0이 된다**.
       실측(2026-07-25): 필터 있음 0px · 제거 859px. 화면에는 첫 카테고리만 삐져나와
       "모바일에서 시장밖에 안 보인다"로 나타났다.
       블러를 끄는 대신 배경을 불투명하게 만들어 스티키 바 가독성을 지킨다. */
    .topnav{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--panel)}
    .topnav .nvin{gap:8px;padding:0 14px}
    .navtoggle{display:inline-flex}
    .navcats{position:fixed;top:52px;left:0;right:0;bottom:0;display:block;margin:0;padding:8px 14px 40px;
             background:var(--ground);border-top:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch}
    .navcats[hidden]{display:none}
    .navcat{position:static;border-bottom:1px solid var(--line-soft)}
    .navcat>button{width:100%;justify-content:space-between;padding:13px 4px;font-size:13.5px}
    .navcat.on>button::after{display:none}
    .mmpanel{position:static;min-width:0;max-width:none;border:0;box-shadow:none;background:none;
             padding:0 0 8px 4px;border-radius:0}
    .mmi{padding:9px 8px}
  }
  @media(min-width:1101px){ .navcats[hidden]{display:flex} }
  @media(prefers-reduced-motion:reduce){.navcat .cv{transition:none}}
</style>

<script>
(function(){
  var root=document.documentElement;
  // ── 테마 ── (초기 적용은 <head> 인라인 스크립트가 이미 했다 — 여기서 다시 하면 이중 실행)
  var tb=document.getElementById('themebtn');
  if(tb)tb.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark'; root.setAttribute('data-theme',next);
    try{localStorage.setItem('yeouido-theme',next);}catch(e){}
  });

  // ── 현재 위치: 마크업이 아니라 <body data-tool>에서 읽는다(메뉴 블록을 전 페이지 동일하게 유지) ──
  var cur=(document.body.getAttribute('data-tool')||'').trim();
  if(cur){
    var a=document.querySelector('.mmi[data-nav="'+cur.replace(/"/g,'')+'"]');
    if(a){a.setAttribute('aria-current','page');
      var li=a.closest('.navcat'); if(li)li.classList.add('on');}
  }

  // ── 카테고리 패널 ──
  var cats=[].slice.call(document.querySelectorAll('.navcat'));
  var drawer=document.getElementById('navcats'), toggle=document.getElementById('navtoggle');
  function mobile(){return matchMedia('(max-width:1100px)').matches;}
  function closeAll(except){
    cats.forEach(function(li){
      var b=li.querySelector('button'), p=li.querySelector('.mmpanel');
      if(li===except||!b||!p)return;
      b.setAttribute('aria-expanded','false'); p.hidden=true;
    });
  }
  cats.forEach(function(li){
    var b=li.querySelector('button'), p=li.querySelector('.mmpanel');
    if(!b||!p)return;
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var open=b.getAttribute('aria-expanded')==='true';
      if(!mobile())closeAll(li);          // 데스크톱은 한 번에 하나만, 모바일 아코디언은 여러 개 허용
      b.setAttribute('aria-expanded',open?'false':'true'); p.hidden=open;
    });
  });
  // 드로어(모바일)
  if(toggle&&drawer){
    drawer.hidden=mobile();
    toggle.addEventListener('click',function(e){
      e.stopPropagation();
      var open=toggle.getAttribute('aria-expanded')==='true';
      toggle.setAttribute('aria-expanded',open?'false':'true');
      drawer.hidden=open; toggle.textContent=open?'☰':'✕';
      toggle.setAttribute('aria-label',open?'메뉴 열기':'메뉴 닫기');
    });
    // 폭이 바뀌면 드로어 상태를 그 폭의 기본값으로 되돌린다(데스크톱에서 hidden이 남으면 메뉴가 사라진다)
    var mq=matchMedia('(max-width:1100px)');
    (mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(function(){
      drawer.hidden=mobile();
      if(toggle){toggle.setAttribute('aria-expanded','false');toggle.textContent='☰';}
      closeAll(null);
    });
  }
  document.addEventListener('click',function(){ if(!mobile())closeAll(null); });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    closeAll(null);
    if(toggle&&toggle.getAttribute('aria-expanded')==='true'){
      toggle.setAttribute('aria-expanded','false');toggle.textContent='☰';
      if(drawer)drawer.hidden=true; toggle.focus();
    }
  });

  // ── 기준일 칩: data/asof.json 정본 하나만 읽는다(페이지마다 다른 날짜를 적지 않는다) ──
  function bdGap(d){
    var p=String(d||'').split('-'); if(p.length!==3)return 0;
    var x=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])), t=new Date(), n=0;
    var end=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());
    while(x.getTime()<end&&n<40){x.setUTCDate(x.getUTCDate()+1);var w=x.getUTCDay();if(w!==0&&w!==6)n++;}
    return n;
  }
  fetch('data/asof.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j||!j.primary)return;
    var el=document.getElementById('navasof'), v=document.getElementById('navasofv');
    if(!el||!v)return;
    v.textContent=j.primary; el.classList.add('ready');
    var n=bdGap(j.primary);
    if(n>=3){el.classList.add('stale');el.title='데이터가 '+n+'영업일 지연 — 자동갱신 확인 필요';}
    else{el.title='데이터 기준일 '+j.primary+' · 축별 기준일은 출처 페이지 참조';}
  }).catch(function(){});
})();
</script>

<main class="wrap wide" id="main">
  <nav class="crumb" aria-label="위치"><a href="index.html">여두 전략 랩</a> · 장중 분봉</nav>
  <h1>장중 분봉 · 거래량</h1>

  <div class="hardnote" id="sessnote">불러오는 중…</div>

  <div class="chiprow" style="margin:10px 0 6px">
    <span class="fchip lbl">정렬</span><span id="sorts" style="display:contents"></span>
  </div>

  <div class="cols">
    <aside class="side">
      <div class="sidehd"><input id="q" type="search" placeholder="티커·회사명 검색" aria-label="종목 검색"></div>
      <div id="list" class="listwrap" role="listbox" aria-label="종목 목록"></div>
    </aside>
    <section id="detail"></section>
  </div>

  <section id="strat" style="margin-top:22px"></section>

  <details class="note" style="margin-top:14px">
    <summary><b>무엇을 보고 있나 · 한계</b></summary>
    <div id="limits" class="lim"></div>
  </details>
</main>
<script>
(function(){
  var el=function(id){return document.getElementById(id);};
  var esc=function(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var nf=function(v,d){return (v==null||v!==v)?'—':Number(v).toFixed(d==null?2:d);};
  var sgn=function(v,d){return v==null?'—':(v>=0?'+':'')+nf(v,d);};
  var vfmt=function(v){ if(v==null)return '—';
    if(v>=1e9)return (v/1e9).toFixed(2)+'B'; if(v>=1e6)return (v/1e6).toFixed(1)+'M';
    if(v>=1e3)return (v/1e3).toFixed(0)+'K'; return String(v);};

  var D=null, BARS={}, state={sel:null,sort:'v',q:''};
  // 정렬 축 — 전부 그 세션 안에서 잰 값이다. 「좋다/나쁘다」를 매기지 않는다.
  var SORTS=[['v','거래량','그 세션 총 거래량'],
             ['r','시가→종가','세션 수익률'],
             ['r_open','오전 30분','장 시작 30분 수익률'],
             ['r_close','마감 30분','마감 30분 수익률'],
             ['clv','종가 위치','0=저가 1=고가 — 마감 압력'],
             ['vs_vwap','VWAP 대비','종가가 그날 평균 체결가보다 얼마나 위인가']];

  function lab(k){ for(var i=0;i<SORTS.length;i++) if(SORTS[i][0]===k) return SORTS[i][1]; return k; }

  function rows(){
    var a=(D&&D.rows||[]).filter(function(r){
      if(!state.q)return true;
      return (r.t+' '+(r.nm||'')).toLowerCase().indexOf(state.q)>=0;});
    var k=state.sort;
    return a.slice().sort(function(x,y){
      var a1=x[k], b1=y[k];
      if(a1==null&&b1==null)return x.t.localeCompare(y.t);
      if(a1==null)return 1; if(b1==null)return -1;
      return (b1-a1)||x.t.localeCompare(y.t);});
  }

  function drawList(){
    var a=rows(), L=el('list');
    if(!a.length){L.innerHTML='<div class="empty">해당 종목 없음</div>';return;}
    if(!state.sel||!a.some(function(r){return r.t===state.sel;}))state.sel=a[0].t;
    var k=state.sort;
    L.innerHTML=a.map(function(r,i){
      var v=r[k], txt=(k==='v')?vfmt(v):(k==='clv'?nf(v,2):sgn(v,2)+'%');
      var col=(k==='v'||k==='clv')?'--ink':((v||0)>=0?'--good':'--hot');
      return '<button class="item" role="option" data-t="'+esc(r.t)+'" aria-selected="'+(r.t===state.sel)+'">'+
        '<span><span class="tkline"><span class="rk">'+(i+1)+'</span><span class="tk">'+esc(r.t)+'</span></span>'+
        '<div class="nm">'+esc(r.nm||'')+'</div></span>'+
        '<span class="metric"><div class="mv" style="color:var('+col+')">'+txt+'</div>'+
        '<div class="nm" style="text-align:right;margin-top:2px">'+esc(lab(k))+'</div></span></button>';
    }).join('');
  }

  function drawDetail(){
    var r=null, a=(D&&D.rows)||[];
    for(var i=0;i<a.length;i++) if(a[i].t===state.sel) r=a[i];
    if(!r){el('detail').innerHTML='';return;}
    var tb=[['시가',nf(r.o,2)],['종가',nf(r.c,2)],['고가',nf(r.h,2)],['저가',nf(r.l,2)],
            ['VWAP',nf(r.vwap,2)],['거래량',vfmt(r.v)],
            ['시가→종가',sgn(r.r,2)+'%'],['오전 30분',sgn(r.r_open,2)+'%'],
            ['마감 30분',sgn(r.r_close,2)+'%'],
            ['종가 위치(0=저 1=고)',nf(r.clv,2)],['VWAP 대비',sgn(r.vs_vwap,2)+'%'],
            ['분봉 수',r.n]];
    el('detail').innerHTML=
      '<div class="card"><h3>'+esc(r.t)+'<span class="hn">'+esc(r.nm||'')+' · '+esc(D.as_of)+' 세션</span></h3>'+
      '<div class="fswrap"><table class="tbl"><tbody>'+
      tb.map(function(x){return '<tr><td class="l">'+x[0]+'</td><td>'+x[1]+'</td></tr>';}).join('')+
      '</tbody></table></div></div>'+
      '<div class="card"><h3>1분봉<span class="hn" id="bhint">불러오는 중…</span></h3>'+
      '<canvas id="ic" height="260" style="width:100%"></canvas></div>';
    loadBars(r.t);
  }

  function loadBars(t){
    if(BARS.hasOwnProperty(t)){paint(BARS[t]);return;}
    fetch('data/id/'+encodeURIComponent(t)+'.json',{cache:'no-cache'})
      .then(function(x){return x.ok?x.json():null;})
      .then(function(j){BARS[t]=j||false; if(state.sel===t)paint(BARS[t]);})
      .catch(function(){BARS[t]=false; if(state.sel===t)paint(false);});
  }

  function paint(b){
    var h=el('bhint'), cv=el('ic');
    if(!b||!b.c||!b.c.length){ if(h)h.textContent='분봉을 못 불러왔습니다 — 추정치로 채우지 않습니다.'; return; }
    if(h)h.textContent=b.d+' · '+b.c.length+'분봉 · '+(b.t0||'')+' 시작';
    if(!cv)return;
    var W=cv.clientWidth||900, H=260, dpr=window.devicePixelRatio||1;
    cv.width=W*dpr; cv.height=H*dpr;
    var x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
    var css=function(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';};
    var c=b.c, v=b.v||[], n=c.length;
    var lo=Math.min.apply(null,c), hi=Math.max.apply(null,c);
    if(!(hi>lo)){hi=lo+1;}
    var PT=10, PB=54, PL=46, PR=52;
    var X=function(i){return PL+(W-PL-PR)*(n<2?0:i/(n-1));};
    var Y=function(p){return PT+(H-PT-PB)*(1-(p-lo)/(hi-lo));};
    // 거래량 — 아래 38px. 색은 직전 분봉 대비 방향이다.
    var vm=1; for(var z=0;z<v.length;z++) if(v[z]>vm) vm=v[z];
    x.globalAlpha=.35;
    for(var i=0;i<n;i++){
      var bh=(v[i]||0)/vm*38;
      x.fillStyle=css(i>0&&c[i]<c[i-1]?'--hot':'--good');
      x.fillRect(X(i)-1,H-14-bh,2,bh);
    }
    x.globalAlpha=1;
    // VWAP — 그날 봉만으로 누적한다(전일을 섞으면 다른 질문이 된다)
    var tv=0,pv=0,vw=[];
    for(var k=0;k<n;k++){tv+=(v[k]||0);pv+=c[k]*(v[k]||0);vw.push(tv>0?pv/tv:c[k]);}
    x.strokeStyle=css('--watch'); x.setLineDash([4,3]); x.lineWidth=1; x.beginPath();
    for(var m=0;m<n;m++){ if(m)x.lineTo(X(m),Y(vw[m])); else x.moveTo(X(m),Y(vw[m])); }
    x.stroke(); x.setLineDash([]);
    // 종가선
    x.strokeStyle=css(c[n-1]>=c[0]?'--good':'--hot'); x.lineWidth=1.6; x.beginPath();
    for(var q=0;q<n;q++){ if(q)x.lineTo(X(q),Y(c[q])); else x.moveTo(X(q),Y(c[q])); }
    x.stroke();
    // 축 라벨
    x.fillStyle=css('--muted'); x.font='11px ui-monospace,monospace';
    x.fillText(nf(hi,2),4,Y(hi)+4); x.fillText(nf(lo,2),4,Y(lo)+4);
    x.fillText('VWAP', W-PR+4, Y(vw[n-1])+4);
    x.fillText('거래량', 4, H-6);
    cv.setAttribute('aria-label', b.t+' '+b.d+' 1분봉 '+n+'개, 시가 '+nf(c[0],2)+' 종가 '+nf(c[n-1],2));
  }

  function chips(){
    var w=el('sorts'); w.innerHTML='';
    SORTS.forEach(function(sd){
      var btn=document.createElement('button');
      btn.className='fchip'; btn.type='button'; btn.title=sd[2];
      btn.setAttribute('aria-pressed', String(state.sort===sd[0]));
      btn.textContent=sd[1];
      btn.onclick=function(){state.sort=sd[0];state.sel=null;chips();drawList();drawDetail();};
      w.appendChild(btn);
    });
  }

  el('list').addEventListener('click',function(e){
    var b=e.target.closest ? e.target.closest('button.item') : null; if(!b)return;
    state.sel=b.getAttribute('data-t'); drawList(); drawDetail();});
  el('q').addEventListener('input',function(e){
    state.q=(e.target.value||'').trim().toLowerCase(); state.sel=null; drawList(); drawDetail();});
  window.addEventListener('resize',function(){ if(state.sel&&BARS[state.sel])paint(BARS[state.sel]); });

  // ── 장중 규칙 6종 — 사전등록 PREREG-2026-08-17-INTRADAY6.md ──────────
  // 🚨 「통과/유효」를 안 쓴다(등록서 §0). 표본이 60거래일이라 판정을 만들 수 없고,
  //   그 사실을 표 머리에 먼저 적는다. 비용 열을 무비용과 **나란히** 둔다 —
  //   일간 회전이라 무비용만 보이면 그 표는 거짓말에 가깝다.
  fetch('data/intraday_strategies.json',{cache:'no-cache'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(!j||!j.strategies||!j.strategies.length)return;
      var rows=j.strategies.slice().sort(function(a,b){return b.excess-a.excess;});
      el('strat').innerHTML=
        '<h2 style="font-size:16px;margin:0 0 8px">장중 규칙 '+j.n+'종 — 잰 값</h2>'+
        '<div class="hardnote" style="margin:0 0 10px">🚨 <b>표본 '+j.n_days_avail+'거래일</b>'+
        '('+esc(j.as_of)+'까지)입니다. 이 랩은 10년짜리에도 「판정 불가」를 적어 왔습니다 — '+
        '<b>60일로 무엇이 통했다고 말할 수 없습니다.</b> 이 표는 「지금 답」이 아니라 '+
        '「나중에 답하려고 규칙을 미리 못박아 둔 것」입니다. 매일 쌓이므로 반년 뒤 120일로 '+
        '다시 재면 그때는 사후 선택이 아닙니다.</div>'+
        '<div class="fswrap"><table class="tbl"><thead><tr>'+
        '<th class="l">규칙</th><th>매매</th><th>일수</th><th>초과 %/일</th><th>t</th>'+
        '<th>승률</th><th>회전</th><th>5bp</th><th>10bp</th><th>20bp</th></tr></thead><tbody>'+
        rows.map(function(r){
          var c=function(v){return '<td style="color:var('+((v||0)>=0?'--good':'--hot')+')">'+sgn(v,3)+'</td>';};
          return '<tr><td class="l">'+esc(r.name)+'</td>'+
            '<td>'+(r.kind==='same'?'당일':'익일')+'</td><td>'+r.n_days+'</td>'+
            c(r.excess)+'<td>'+nf(r.t,2)+'</td><td>'+nf(r.win,1)+'%</td>'+
            '<td>'+nf(r.turnover,2)+'</td>'+
            c(r.net['5'].mean)+c(r.net['10'].mean)+c(r.net['20'].mean)+'</tr>';
        }).join('')+'</tbody></table></div>'+
        '<div class="lim" style="margin-top:8px">· '+(j.limits||[]).map(function(x){
          return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}).join('<br>· ')+'</div>';
    }).catch(function(){});

  fetch('data/intraday.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(!j||!j.rows){el('sessnote').innerHTML='<b>불러오지 못했습니다</b> — <code>data/intraday.json</code>이 아직 없습니다. 추정치로 채우지 않습니다.';return;}
      D=j;
      // 🚨 「지금」이 아니라는 것을 맨 위에 크게 적는다. 갱신이 장 마감 뒤 하루 한 번이라
      //   장중에 이 화면을 보면 직전 거래일 것이다 — 모르고 보면 오해가 아니라 오독이다.
      el('sessnote').innerHTML='<b>'+esc(j.as_of)+' 세션</b>입니다 — <b>지금 시세가 아닙니다.</b> '+
        '갱신 잡이 장 마감 뒤 하루 한 번 돌기 때문에 장중에 보면 직전 거래일 것입니다. '+
        '종목 '+j.n+'종 · 1분봉 · 거래량 많은 순.';
      el('limits').innerHTML='· '+(j.limits||[]).map(function(x){
        return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}).join('<br>· ');
      chips(); drawList(); drawDetail();
    })
    .catch(function(){el('sessnote').innerHTML='<b>불러오지 못했습니다</b> — 네트워크 오류.';});
})();

</script>
