name: Refresh SEC financials (XBRL)

# SEC EDGAR companyfacts에서 회사별 재무 시계열을 수집한다. 무인증·무료.
# 표준 라이브러리만 쓰므로 설치 단계가 없다.
#
# 주기 — 주 1회. 재무는 실적 발표 때만 바뀌고, 발표는 회사마다 흩어져 있어
#   매일 돌려도 대부분의 파일이 그대로다(수집기가 내용 동일이면 아예 쓰지 않는다).
#
# 소요 — 실측 약 4분(518사 · 회사당 gz 262~510KB · 8 req/s 상한). 다운로드 약 180MB.
#   공시 잡(토 10:15)과 30분 띄워 SEC에 동시에 몰리지 않게 한다.

on:
  schedule:
    - cron: '50 22 * * 5'    # 매주 토 07:50 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-facts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect XBRL financials
        run: python build/refresh_facts.py
      - name: Rebuild as-of index
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_site.py
      # ⚠ 산출물 전부 넘긴다: facts.json(요약)·data/fx/(회사별, 삭제 포함).
      #   빠뜨림은 ci_push.sh의 누락 가드가 data/ 전체를 훑어 잡는다.
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): SEC 재무 시계열 자동 갱신" \
            data/facts.json data/fx data/asof.json
      # 재무 축은 '회사의 최근 보고 기간말'이라 분기마다 한 번씩만 움직인다.
      # 분기 발표 주기(약 90일)를 넘겨야 이상한 것이므로 창을 넉넉히 잡는다.
      - name: Verify freshness
        run: python build/check_freshness.py data/facts.json "SEC 재무" 90
