name: Refresh SEC filings (EDGAR)

# 8-K 피드 · SIC 산업분류 · 회사별 제출 이력을 SEC EDGAR submissions API에서 수집한다.
# 무인증·무료. 표준 라이브러리만 쓰므로 설치 단계가 없다(의존성이 늘면 크론이 깨질 확률도 는다).
#
# 주기 — 주 1회. 8-K는 매일 몇 건씩 들어오지만 이 랩의 화면은 90일 창을 보여주므로
#   하루 단위 신선도가 필요 없고, 518사 전수 호출이 SEC에 매일 걸 부하도 아니다.
#   가격·레짐 잡들과 달리 '오늘 날짜'가 화면에 뜨지도 않는다(축은 최근 제출 접수일이다).
#
# 소요 — 실측 약 2분 15초(518사 · 8 req/s 상한). 타임아웃은 넉넉히 15분.

on:
  schedule:
    - cron: '45 23 * * 5'    # 매주 토 08:45 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-filings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 설치 단계 없음 — build/edgar.py는 urllib·gzip·json만 쓴다
      - name: Collect SEC filings
        run: python build/refresh_filings.py
      # 홈은 원본 대신 슬림 묶음(build/home_flow.py)을 읽는다 — 원본이 바뀌면 같이 다시 굽는다.
      # 빠뜨리면 홈만 옛 데이터를 말하고 아무도 알려주지 않는다.
      - name: Rebuild home slim bundle
        run: python build/home_flow.py
      - name: Rebuild as-of index
        # 기준일 정본(data/asof.json)에 filings 축이 있다 — 원본이 바뀌면 다시 구워야 한다.
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_site.py
      # ⚠ 산출물 전부 넘긴다: filings.json(8-K 피드)·industry.json(SIC)·data/fil/(회사별, 삭제 포함).
      #   빠뜨림은 ci_push.sh의 누락 가드가 data/ 전체를 훑어 잡는다.
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): SEC 공시·산업분류 자동 갱신" \
            data/filings.json data/industry.json data/fil data/home_flow.json data/asof.json
      # '돌았는데 낡은 데이터'면 잡 실패 → GitHub 기본 실패 알림 메일.
      # 창이 넉넉한 이유: as_of는 우리가 수집한 날이 아니라 회사가 마지막으로 제출한 날이다.
      # 연휴가 길면 며칠씩 안 움직이는 게 정상이라, 가격 잡(2일)과 같은 잣대를 쓰면 오탐이 된다.
      - name: Verify freshness
        run: python build/check_freshness.py data/filings.json "SEC 공시" 10
