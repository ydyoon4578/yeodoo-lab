name: Refresh market sentiment (VIX/FRED)

on:
  schedule:
    - cron: '20 22 * * 0-5'    # 매일(월~토) 07:20 KST (UTC 자정 前이라 요일은 0-5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sentiment
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet pandas numpy scipy yfinance fredapi
      - name: Compute market sentiment index
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build/refresh_sentiment.py
      - name: Rebuild as-of index
        # 기준일 정본(data/asof.json)은 원본이 바뀔 때마다 다시 구워야 한다.
        # 안 그러면 전 페이지 내비 칩이 어제 날짜를 말하고, validate_site.py의
        # '기준일 정본 불일치' 검사가 다음 실행에서 잡을 실패시킨다.
        run: python build/asof_index.py
      # 커밋·푸시·경합 재시도는 build/ci_push.sh 한 곳에만 있다.
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 시장 심리 지수 자동 갱신" data/sentiment.json data/asof.json
      # '돌았는데 낡은 데이터'면 잡 실패 → GitHub 기본 실패 알림 메일. '안 뜬' 케이스는 sources.html 배지가 드러낸다.
      - name: Verify freshness
        run: python build/check_freshness.py data/sentiment.json "시장 심리" 2
