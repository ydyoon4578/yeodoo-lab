name: Refresh customer concentration (weekly)

# 고객 집중도(data/cust_conc.json) — 10-K·20-F 원문에서 뽑은 **단일 고객** 매출 비중.
# 규약: build/PREREG-2026-08-04-CUSTCONC.md (수집 전에 확정해 커밋했다).
#
# 🚨 왜 이 잡이 2026-08-19 에야 생겼나. 이 자료는 화면에 실린 규칙 x-custconc 가 읽는데
#   **어느 워크플로에도 없었다**(build/audit_unbuilt.py 가 찾았다). 손으로만 굽는 자료라,
#   10-K 가 새로 나와도 아무도 다시 굽지 않았다.
#
# ⚠ 첫 실행은 길다. 유니버스 517종을 처음 훑을 때 10-K 원문을 종목당 약 17건 받는다
#   (실측 10종/분 → 약 50분). 두 번째부터는 «마지막으로 훑은 제출일»(cust_conc.json 의
#   scan 블록)보다 새 제출만 받으므로 제출목록 조회 517콜 + 새 10-K 몇 건이면 끝난다.
#   그래서 timeout 을 넉넉히 두되, 주 1회만 돈다.
#
# 🚨 두 레그를 **다 돌린다.**
#   ① 현재 유니버스(cik_map)  ② --pit: 편출·상폐 종목(pit_universe)
#   ②가 없으면 PIT 레그의 후보가 생존자로만 좁혀져, 생존편향을 재려는 표가 오히려
#   그 편향을 갖는다. 빌더는 이제 언제나 기존 산출물과 병합하므로 한 레그가 다른
#   레그의 자료를 지우지 않는다(2026-08-19 수정 전에는 지웠다).

on:
  schedule:
    - cron: '20 21 * * 5'      # 매주 토 06:20 KST — SEC 잡들(07:0x) 앞에 둔다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-custconc
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 🚨 기준선 — 일을 시작하기 전 저장소가 이미 몇 건 깨져 있었는지 잰다.
      #   없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는 결함 때문에
      #   방금 받은 자료를 통째로 버린다.
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Scan current universe
        run: python build/refresh_custconc.py
      # ⚠ 편출 레그는 실패해도 잡을 죽이지 않는다 — ①의 결과는 이미 파일에 들어가 있고,
      #   병합 구조라 ②가 빠져도 기존 편출분이 지워지지 않는다.
      - name: Scan delisted universe (PIT leg)
        run: python build/refresh_custconc.py --pit
        continue-on-error: true
      - name: Validate
        run: python build/validate_gate.py check
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 고객 집중도 자동 갱신" data/cust_conc.json
      # 🚨 신선도 게이트 — 관문은 «자료가 깨졌나» 를 보지 «잡이 돌았는데 안 움직였나» 를
      #   안 본다. 10-K 는 연 1회라 기준일이 길게 뒤처질 수 있으므로 문턱을 넉넉히 둔다.
      - name: Verify freshness
        run: python build/check_freshness.py data/cust_conc.json "고객 집중도" 40 --key generated
