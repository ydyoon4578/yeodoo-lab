name: Refresh index membership

# 유니버스 명단(data/members.json)을 공개 소스에서 자동 갱신한다.
#
# ⚠ 이 파일은 사이트 전체의 출발점이다. 잘못 갱신되면 모든 화면이 함께 틀어지는데
#   아무도 알려주지 않는다. 그래서 스크립트가 관문 4개(두 소스 합의·개수 범위·변동 상한·
#   섹터 완전성)를 통과할 때만 쓰고, 하나라도 걸리면 **파일을 건드리지 않고 실패**한다.
#   잡이 빨갛게 뜨는 게 잘못된 명단이 조용히 배포되는 것보다 낫다.
#
# 순서 — 토요일 06:45, 종목 갱신(06:50)보다 먼저다. 새 유니버스로 그날 스냅샷을 굽기 위해서다.
#   ⚠ 2026-08-11 에 전 잡을 KST 08:00 이전으로 당기면서 함께 옮겼다(순서는 그대로).

on:
  schedule:
    - cron: '45 21 * * 5'    # 매주 토 06:45 KST — 종목 갱신(06:50)보다 앞
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-members
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 🚨 2026-08-05 — 기준선. 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지
      #   잰다. 이게 없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는
      #   결함 때문에 방금 받은 자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Refresh membership (gated)
        run: python build/refresh_members.py
      # 🚨 2026-09-03 — **시점정합 편입 «이력»을 여기서 같이 굽는다.**
      #   members.json 은 스스로 note 에 「오늘 스냅샷이며 과거 편입 이력이 아니다」라고
      #   적어 뒀다. 생존편향 보정이 실제로 읽는 것은 data/index_history.json 인데,
      #   그 파일을 굽는 잡이 **저장소에 하나도 없었다**(grep 0건). 마지막 쓰기가
      #   2026-08-14 라 09-03 시점에 20일 고착이었고, 그 사이 새 달 키가 안 생겨
      #   ndx_members('2026-09') 가 0종이 됐다 — NDX 계열 다섯이 무보유가 되는 사고가
      #   2026-10-02 로 예약돼 있었다(build/index_members.py 의 꼬리 규약 주석).
      #   ⚠ 이 스크립트는 **표준 라이브러리만** 쓰고(외부 의존 0) 증분이라 실측 7.7초다.
      #     러너가 돌 수 있게 만들어 놓고 배선만 안 한 것이다 — 이 저장소의 되풀이 결함 1번.
      #   ⚠ refresh_members 뒤에 둔다. 둘은 서로 안 읽지만, 명단 관문이 막히면 이력도
      #     같이 세우는 편이 낫다(그날 자료가 통째로 의심스러운 상황이다).
      - name: Refresh PIT membership history
        run: python build/refresh_index_history.py
      - name: Rebuild as-of index
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_gate.py check
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 지수 편입 명단·시점정합 이력 자동 갱신" \
            data/members.json data/index_history.json data/asof.json
      # 🚨 2026-08-16 점검에서 이 잡에 신선도 게이트가 없던 것을 찾았다. 관문(validate_gate)은
      #   «자료가 깨졌나» 를 보지 «잡이 돌았는데 안 움직였나» 를 안 본다. 크론이 조용히
      #   드롭되면 잡은 초록인데 산출물만 낡는다 — check_freshness.py 가 그것 때문에 있다.
      #   매주 토 1회라 5영업일이 정상 간격이다. 8 이면 두 주가 빈 것이다.
      - name: Verify freshness
        run: |
          python build/check_freshness.py data/members.json "지수 편입 명단" 8 --key as_of_members
          # 🚨 2026-09-03 — 시점정합 이력도 본다. 이 파일은 굽는 잡이 아예 없어 20일 고착했고
          #   화면은 다른 파일(members.json)의 날짜로 초록이었다. 같은 날 빌더를 배선했으니
          #   감시도 같이 건다 — 배선만 하고 감시를 안 걸면 다음에 또 조용히 굳는다.
          #   ⚠ as_of 가 'YYYY-MM'(월 키)이라 일 단위 문턱을 그대로 못 쓴다. 월이 넘어간 뒤
          #     첫 토요일까지가 정상 최대이므로 넉넉히 40영업일(약 두 달)로 둔다 —
          #     그보다 오래면 index_members.at 의 이월 한도(2달)에도 걸려 엔진이 죽는다.
          python build/check_freshness.py data/index_history.json "시점정합 편입 이력" 40
