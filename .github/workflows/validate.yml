name: Validate site

# 브라우저 검증이 불가한 환경이라, 푸시마다 정적 검증으로 '깨진 배포'를 막는다.
# 검사: 인라인 JS 괄호 균형·정의되지 않은 호출(오타)·data/*.json 파싱·rotation 풀 스키마·
#       lab 링크 앵커 실재·선별 상수(QUOTA/CATORD) 프론트↔일일잡 일치.
on:
  push:
    # ⚠ 워크플로 전체를 넣는다. 예전엔 validate.yml 하나만 있어서 **cron 만 고친 커밋에는
    #   CI 가 아예 돌지 않았다** — 라벨 정본(data/schedule.json) 재생성을 빠뜨린 바로 그 커밋이
    #   게이트를 통과하는 구조였다.
    paths: ['**.html', 'data/**', 'build/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
  # 🚨 2026-09-03 — **예정 실행을 더한다. 봇 커밋에는 이 CI 가 아예 안 돈다.**
  #   GitHub Actions 는 GITHUB_TOKEN 으로 민 푸시에 워크플로를 재귀 실행하지 않는다.
  #   실측(최근 10일): **봇 커밋 96건 중 validate 런이 있는 것 0건.** 사람 커밋은 105건 중 48건.
  #   그동안 이 구멍이 안 보인 이유는 각 자료 잡이 커밋 전에 validate_gate 를 돌기 때문인데,
  #   그것은 **회귀 관문**이다 — 「이 잡이 늘렸나」만 본다. 그래서 **이미 서 있는 결함은
  #   어느 잡도 막지 않고, 그것을 보고할 CI 는 안 돈다.** 실제로 그 상태가 있었다:
  #   09-02 refresh-tech 의 기준선 1건(「지수 등락률이 2영업일 밀렸는데 머리글에 경고가
  #   없다」)은 3시간 22분 뒤 사람 커밋에 딸려서야 붉게 떴다.
  #   ⚠ validate_gate.py 독스트링이 「push 마다 도는 Validate site 워크플로가 계속 붉게
  #     띄우므로 숨겨지지 않는다」고 적어 근거로 삼는데, 그 전제가 반만 참이었다.
  #     예정 실행을 두면 그 전제가 참이 된다 — 누가 밀었든 하루 한 번은 본다.
  #   ⚠ 자료 잡 무리(UTC 21:45~23:30)가 끝난 뒤로 잡는다. 그 전에 돌면 갱신 중간 상태를 본다.
  schedule:
    - cron: '30 0 * * *'    # 매일 09:30 KST — 아침 갱신 무리가 끝난 뒤

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # 🚨 2026-09-03 — 이력을 받는다. 기본값(fetch-depth: 1)이면 git log 가 비어
      #   validate_site 의 «갱신 피드 대조» 가 **조용히 건너뛴다** — 러너 로그 실측:
      #   「갱신 피드 대조 건너뜀 — git 이력을 못 읽었다(얕은 체크아웃?). 통과가 아니라
      #   미검증이다」. 그 검사는 «사람이 log_update 를 부르는 것을 잊었나» 를 보는 것이라
      #   **사람이 푸시하는 이 잡이 유일하게 걸 자리**다(자료 잡은 봇 커밋이라 셀 것이 없다).
      #   ⚠ filter: blob:none — 이 검사는 `git log` 만 쓰고 과거 파일 내용을 안 본다.
      #     팩이 188MB 라 blob 까지 받으면 매 푸시가 비싸진다. 커밋·트리만 받고 작업
      #     트리 blob 은 체크아웃이 필요한 만큼만 가져온다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate (표준 라이브러리만 사용 — 설치 단계 없음)
        run: python build/validate_site.py
