name: Validate site

# 브라우저 검증이 불가한 환경이라, 푸시마다 정적 검증으로 '깨진 배포'를 막는다.
# 검사: 인라인 JS 괄호 균형·정의되지 않은 호출(오타)·data/*.json 파싱·rotation 풀 스키마·
#       lab 링크 앵커 실재·선별 상수(QUOTA/CATORD) 프론트↔일일잡 일치.
on:
  push:
    # ⚠ 워크플로 전체를 넣는다. 예전엔 validate.yml 하나만 있어서 **cron 만 고친 커밋에는
    #   CI 가 아예 돌지 않았다** — 라벨 정본(data/schedule.json) 재생성을 빠뜨린 바로 그 커밋이
    #   게이트를 통과하는 구조였다.
    paths: ['**.html', 'data/**', 'build/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate (표준 라이브러리만 사용 — 설치 단계 없음)
        run: python build/validate_site.py
