name: Validate site

# 브라우저 검증이 불가한 환경이라, 푸시마다 정적 검증으로 '깨진 배포'를 막는다.
# 검사: 인라인 JS 괄호 균형·정의되지 않은 호출(오타)·data/*.json 파싱·rotation 풀 스키마·
#       lab 링크 앵커 실재·선별 상수(QUOTA/CATORD) 프론트↔일일잡 일치.
on:
  push:
    # ⚠ 워크플로 전체를 넣는다. 예전엔 validate.yml 하나만 있어서 **cron 만 고친 커밋에는
    #   CI 가 아예 돌지 않았다** — 라벨 정본(data/schedule.json) 재생성을 빠뜨린 바로 그 커밋이
    #   게이트를 통과하는 구조였다.
    paths: ['**.html', 'data/**', 'build/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # 🚨 2026-09-03 — 이력을 받는다. 기본값(fetch-depth: 1)이면 git log 가 비어
      #   validate_site 의 «갱신 피드 대조» 가 **조용히 건너뛴다** — 러너 로그 실측:
      #   「갱신 피드 대조 건너뜀 — git 이력을 못 읽었다(얕은 체크아웃?). 통과가 아니라
      #   미검증이다」. 그 검사는 «사람이 log_update 를 부르는 것을 잊었나» 를 보는 것이라
      #   **사람이 푸시하는 이 잡이 유일하게 걸 자리**다(자료 잡은 봇 커밋이라 셀 것이 없다).
      #   ⚠ filter: blob:none — 이 검사는 `git log` 만 쓰고 과거 파일 내용을 안 본다.
      #     팩이 188MB 라 blob 까지 받으면 매 푸시가 비싸진다. 커밋·트리만 받고 작업
      #     트리 blob 은 체크아웃이 필요한 만큼만 가져온다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate (표준 라이브러리만 사용 — 설치 단계 없음)
        run: python build/validate_site.py
