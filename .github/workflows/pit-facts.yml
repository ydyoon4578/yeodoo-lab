name: Collect SEC financials for index-departed names

# 지수에서 빠진 종목의 SEC 재무를 받아 data/fx_pit/ 에 넣는다.
# 이것이 있어야 build/style_pit.py 가 퀄리티·가치·성장까지 PIT 로 잴 수 있다
# (data/fx/ 는 오늘의 유니버스뿐이고, refresh_facts.py 가 그 밖의 파일을 지운다).
#
# 🚨 왜 러너인가 — SEC 는 사내 PC 의 로컬 호출 화이트리스트에 없다. 이 랩은 SEC 를
#   러너에서만 받고(refresh-facts.yml) 이 잡도 같은 경로다. 사내망을 타지 않는다.
#
# 주기 없음(workflow_dispatch 전용). 받을 명단은 data/style_pit.json 의
#   universe.gone_tickers 이고, 그것은 사내망 PC 에서 build/style_pit.py 가 넣는다 —
#   멤버십 원천이 gitignore 라 러너가 스스로 계산할 수 없다. 명단이 바뀔 때만 돌리면 된다.
#
# 무게 — 편출 종목 수십 개뿐이라 회사당 gz 수백KB · 8 req/s 상한으로 1~2분.
#   표준 라이브러리만 쓰므로 설치 단계가 없다.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pit-facts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect XBRL financials for departed names
        run: python build/pit_facts.py
      - name: Validate
        run: python build/validate_site.py
      # data/fx_pit 는 러너만 채운다. 사내망 PC 는 이것을 pull 해서 style_pit.py 에 물린다.
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 편출 종목 SEC 재무 수집(PIT 백테스트용)" \
            data/fx_pit
