name: Refresh market regime (FRED)

on:
  schedule:
    - cron: '10 22 * * 0-5'    # 매일(월~토) 07:10 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-regime
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet pandas numpy yfinance fredapi
      # 🚨 2026-08-05 — 기준선. 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지
      #   잰다. 이게 없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는
      #   결함 때문에 방금 받은 자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Compute market regime
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build/refresh_regime.py
      # 홈 전용 시장 요약(data/home_market.json) — 홈 카드가 쓰는 필드만 담은 발췌.
      # ⚠ **두 잡(refresh-regime 07:10 · refresh-sentiment 07:20)이 모두 이걸 굽는다.**
      #   한쪽에만 두면 그쪽이 먼저 도는 날 다른 원본이 어제 것이라 반쪽이 하루 낡는다.
      #   양쪽에 두면 커밋이 경합하는데, 그건 build/ci_push.sh 의 REBAKE_TABLE 이 설계된
      #   상황이다 — 먼저 민 쪽 것을 받고 **두 원본이 다 있는 트리에서** 다시 구워 준다.
      #   그래서 표 등록이 필수다(등록이 없으면 충돌 시 그날치가 통째로 버려진다).
      - name: Rebuild home market bundle
        run: python build/home_market.py
      - name: Rebuild as-of index
        # 기준일 정본(data/asof.json)은 원본이 바뀔 때마다 다시 구워야 한다.
        # 안 그러면 전 페이지 내비 칩이 어제 날짜를 말하고, validate_site.py의
        # '기준일 정본 불일치' 검사가 다음 실행에서 잡을 실패시킨다.
        run: python build/asof_index.py
      # 커밋·푸시·경합 재시도는 build/ci_push.sh 한 곳에만 있다.
      # (인라인으로 복사해 두던 1회 재시도는 asof.json 충돌을 원리상 못 넘겨 2026-07-25에 이 잡이 죽었다)
      # ⚠ 이 잡에는 원래 Validate 단계가 없었다. validate_site.py 의 'ci_push 를 쓰면
      #   validate_site 도 써야 한다' 검사가 **파일 안 문자열 포함** 여부라, 위 주석에 적힌
      #   'validate_site.py' 글자만으로 통과하고 있었다. 봇 커밋에는 validate.yml 이 안 돌아
      #   이 축은 실제로 아무 검증도 거치지 않고 배포돼 왔다.
      - name: Validate
        run: python build/validate_gate.py check
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 시장 국면(레짐) 자동 갱신" \
            data/regime.json data/home_market.json data/asof.json
      # '돌았는데 낡은 데이터'면 잡 실패 → GitHub 기본 실패 알림 메일. '안 뜬' 케이스는 sources.html 배지가 드러낸다.
      - name: Verify freshness
        run: python build/check_freshness.py data/regime.json "시장 국면" 2
