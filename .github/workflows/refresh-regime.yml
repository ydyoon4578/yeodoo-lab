name: Refresh market regime (FRED)

on:
  schedule:
    - cron: '45 23 * * *'    # 매일 08:45 KST (23:45 UTC 전일) — stocks(08:35)와 분(minute) 어긋나게: 같은 브랜치 동시 push 경쟁 회피
    - cron: '20 0 * * *'     # 09:20 KST 백업 (stocks 09:10 백업과도 분리)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-regime
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet pandas numpy yfinance fredapi
      - name: Compute market regime
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build/refresh_regime.py
      - name: Rebuild as-of index
        # 기준일 정본(data/asof.json)은 원본이 바뀔 때마다 다시 구워야 한다.
        # 안 그러면 전 페이지 내비 칩이 어제 날짜를 말하고, validate_site.py의
        # '기준일 정본 불일치' 검사가 다음 실행에서 잡을 실패시킨다.
        run: python build/asof_index.py
      # 커밋·푸시·경합 재시도는 build/ci_push.sh 한 곳에만 있다.
      # (인라인으로 복사해 두던 1회 재시도는 asof.json 충돌을 원리상 못 넘겨 2026-07-25에 이 잡이 죽었다)
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 시장 국면(레짐) 자동 갱신" data/regime.json data/asof.json
      # '돌았는데 낡은 데이터'면 잡 실패 → GitHub 기본 실패 알림 메일. '안 뜬' 케이스는 sources.html 배지가 드러낸다.
      - name: Verify freshness
        run: python build/check_freshness.py data/regime.json "시장 국면" 2
