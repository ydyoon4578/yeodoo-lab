name: Refresh 13F history (SEC, quarterly)

# 운용사별 13F 보유 **이력**(data/guru_history.json)만 받는다.
#
# 왜 따로인가 — 2026-07-27 에 이 작업이 주간 자산 패널 잡에 얹혀 있다가 **네 번 연속 폐기**됐다.
#   그 잡은 마지막에 한 번만 커밋하는데, 뒤쪽 어느 단계가 죽어도 Commit if changed 가 스킵되어
#   앞서 받아둔 것이 통째로 버려진다. 실제 사유는 매번 달랐다:
#     ① 날짜 조건으로 13F 단계 자체를 건너뜀   ② market_board 의 IWM 결손
#     ③ assets.json 푸시 충돌                ④ asof 가 시장일 앞섬을 오기입으로 오판
#   전부 13F 와 무관한 실패다. 18운용사 × 약 50분기를 다시 읽는 데 몇 분이 드는데,
#   남의 실패에 휘말려 버려질 이유가 없다. 여기서는 이 작업만 하고 바로 커밋한다.
#
# 주기 — 13F 는 분기말 잔고를 45일 뒤에 낸다(마감 2/14 · 5/15 · 8/14 · 11/14).
#   매월 16일에 돌면 네 마감을 모두 이틀 여유로 지나고, 나머지 달에는 늦게 낸 곳을 줍는다.
#   분기에 한 번만 바뀌는 데이터라 이보다 자주 받을 이유가 없다.
#
# 하류 — guru_history.json 을 읽는 것은 build/ml_backtest.py(13F 복제) 하나뿐이고, 그것은
#   주간 자산 패널 잡이 다시 굽는다. 그래서 여기서는 다시 굽지 않는다. 13F 는 분기 데이터라
#   복제 성과가 최대 한 주 늦게 반영되는 것은 무해하고, 그 대신 이 잡의 실패면을 좁게 유지한다.

on:
  schedule:
    - cron: '22 22 15 * *'    # 매월 16일 07:22 KST (제출 마감 2/14·5/15·8/14·11/14 직후)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-13f-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # yfinance 는 복제용 월봉(mpx)을 받는 데 쓴다. pandas·numpy 는 그 의존이다.
      - name: Install deps
        # 🚨 2026-08-19 — --prefer-binary. lxml 6.1.2 가 wheel 없이 올라와
        #   pip 이 소스 빌드로 넘어갔고 러너에 libxml2-dev 가 없어 죽었다
        #   (yfinance 의 전이 의존이라 우리가 부르지도 않는 패키지다).
        #   ⚠ 판을 손으로 박지 않는다 — 박은 수는 낡는다. wheel 이 있는 최신 판을
        #     고르게 두면 벤더가 wheel 을 올리는 대로 저절로 따라간다.
        run: pip install --prefer-binary --quiet pandas numpy scipy yfinance
      # 🚨 2026-08-05 — 기준선. 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지
      #   잰다. 이게 없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는
      #   결함 때문에 방금 받은 자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Fetch 13F history
        run: python build/refresh_13f_history.py
      # 운용사별 복제 진단물 — 입력이 guru_history.json 뿐이라 같이 굽는다(네트워크 없음).
      - name: Rebuild guru replication diagnostic
        run: python build/guru17_backtest.py
      # 🚨 2026-08-18 — 이 둘도 입력이 guru_history.json 뿐인데 **어느 워크플로에도 없었다.**
      #   이력은 매주 토 갱신되는데 이 산출물만 손으로 굽던 것이라, 갱신 때마다 조용히
      #   낡았다(랩이 되풀이하는 «수집만 하고 배선 안 함»). 같은 잡에 붙여 한 번에 굽는다.
      - name: Rebuild guru overlap backtest
        run: python build/guru_overlap_backtest.py
      - name: Rebuild guru quarterly performance
        run: python build/guru_quarter_perf.py
      - name: Validate
        run: python build/validate_gate.py check
      # 이 잡은 asof 축을 건드리지 않는다(guru 축은 guru.json 이 대표다) — asof.json 을 넘기지 않는다.
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 13F 보유 이력·복제 진단 자동 갱신" \
            data/guru_history.json data/guru17.json data/guru_overlap.json data/guru_qperf.json
      # 🚨 2026-08-16 점검에서 이 잡에 신선도 게이트가 없던 것을 찾았다. 관문(validate_gate)은
      #   «자료가 깨졌나» 를 보지 «잡이 돌았는데 안 움직였나» 를 안 본다. 크론이 조용히
      #   드롭되면 잡은 초록인데 산출물만 낡는다 — check_freshness.py 가 그것 때문에 있다.
      #   13F 는 분기말 45일 뒤 공시라 기준일이 최대 한 분기 뒤처진다. refresh-13f 와 같은 150 을 쓴다.
      - name: Verify freshness
        run: python build/check_freshness.py data/guru_history.json "13F 보유 이력" 150
