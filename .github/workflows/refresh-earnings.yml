name: Refresh earnings calendar (Finnhub)

# 실적 발표 예정일·컨센서스 EPS를 유니버스에 맞춰 받는다.
#
# 왜 매일인가 — 회사가 예정일을 자주 바꾸고, '오늘/내일 발표' 표시가 하루만 지나도 틀린다.
#
# 키 — 저장소 시크릿 FINNHUB_API_KEY. 이 저장소는 공개이므로 키를 파일·로그에 남기지 않는다.
#   (과거 FRED 키가 커밋에 남은 사고가 있었다.)
#
# 무게 — Finnhub은 7일씩 끊어 약 17회 호출(상한에 닿은 구간만 반씩 쪼개 몇 회 더 붙는다).
#   무료 티어 분당 제한을 피하려 호출 사이 1.1초 쉰다.
#   여기에 Nasdaq 교차검증이 영업일당 1회씩 약 49회 붙는다(0.4초 간격). 합쳐 실측 약 70초.
#   Nasdaq이 막히면 그 단계만 건너뛰고 Finnhub 단독으로 싣는다 — 잡을 실패시키지는 않되,
#   로그에 ⚠ 를 남기고 earnings.json 의 xcheck.ok 를 false 로 적는다(조용한 통과 금지).

on:
  schedule:
    - cron: '0 22 * * 0-5'    # 매일(월~토) 07:00 KST — 종목 갱신 뒤(유니버스를 그날 것으로 쓴다)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-earnings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 🚨 2026-08-05 — 기준선. 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지
      #   잰다. 이게 없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는
      #   결함 때문에 방금 받은 자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Fetch earnings calendar
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python build/refresh_earnings.py
      # 홈은 원본 대신 슬림 묶음(build/home_flow.py)을 읽는다 — 원본이 바뀌면 같이 다시 굽는다.
      # 빠뜨리면 홈만 옛 데이터를 말하고 아무도 알려주지 않는다.
      - name: Rebuild home slim bundle
        run: python build/home_flow.py
      - name: Rebuild as-of index
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_gate.py check
      # earnings_history.json은 **누적 파일**이다 — 커밋 대상에서 빠지면 매 실행이 fresh checkout이라
      # 그동안 쌓은 발표 이력이 영구 유실된다(target_history.json과 같은 함정).
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 실적 발표 일정 자동 갱신" \
            data/earnings.json data/earnings_history.json data/home_flow.json data/asof.json
      - name: Verify freshness
        run: python build/check_freshness.py data/earnings.json "실적 일정" 4
