name: Refresh insider transactions (Form 4/5)

# SEC Form 3/4/5 분기 데이터셋에서 임원·이사·10% 주주의 보통주 거래를 수집한다.
# 무인증·무료. 표준 라이브러리만 쓰므로 설치 단계가 없다.
#
# 주기 — 주 1회. 소스가 **분기 단위**라 사실 분기에 한 번만 실제로 바뀐다.
#   그래도 주 1회를 도는 이유는 새 분기 파일이 언제 올라오는지 SEC가 예고하지 않기 때문이다
#   (내용이 같으면 수집기가 파일을 아예 쓰지 않아 커밋도 안 생긴다).
#
# 소요 — 실측 약 2분(분기 ZIP 28MB × 2). 다른 SEC 잡과 30분씩 띄운다.

on:
  schedule:
    - cron: '13 22 * * 5'    # 매주 토 07:13 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-insider
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 🚨 2026-08-05 — 기준선. 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지
      #   잰다. 이게 없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는
      #   결함 때문에 방금 받은 자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Collect insider transactions
        run: python build/refresh_insider.py
      # 홈은 원본 대신 슬림 묶음(build/home_flow.py)을 읽는다 — 원본이 바뀌면 같이 다시 굽는다.
      # 빠뜨리면 홈만 옛 데이터를 말하고 아무도 알려주지 않는다.
      - name: Rebuild home slim bundle
        run: python build/home_flow.py
      # 홈 '내부자 거래' 구획도 여기서 함께 굽는다. 원본(data/ins)이 바뀌는 유일한 잡이
      # 이것이라, 여기 없으면 그 구획만 옛 분기를 말한 채 얼어붙는다(랩이 이미 겪은 함정).
      - name: Rebuild home insider panel
        run: python build/home_insider.py
      - name: Rebuild as-of index
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_gate.py check
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 내부자 거래 자동 갱신" \
            data/insider.json data/ins data/home_flow.json data/home_insider.json data/asof.json
      # 이 축은 분기에 한 번 움직인다. 실측 지연이 25일이었으므로, 한 분기를 통째로
      # 건너뛴 경우(≈120일)에만 실패하도록 창을 넉넉히 잡는다.
      - name: Verify freshness
        run: python build/check_freshness.py data/insider.json "내부자 거래" 120
