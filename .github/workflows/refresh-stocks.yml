name: Refresh stock signals (yfinance)

on:
  schedule:
    - cron: '50 21 * * 0-5'    # 본 슬롯 — 매일(월~토) 06:50 KST, 미국장 마감 후(겨울 EST 마감 +35분)
    # 백업 슬롯 — 본 슬롯이 유실된 날을 잃지 않기 위한 것이다. GitHub 스케줄 크론은 지연·드롭이
    # 잦고(실측: stocks 가 커밋 없이 07-21 에 고착), 그런 날은 테크니컬 신호뿐 아니라 **소급해서
    # 만들 수 없는** target_history·fund_history 스냅샷까지 통째로 빈다.
    # ⚠ 이 슬롯은 매일 뜨지만 매일 일하지는 않는다 — 아래 gate 잡이 오늘치가 이미 커밋됐으면
    #   본 잡을 통째로 건너뛴다. 안 그러면 519종을 하루 두 번 받아 야후 쓰로틀 위험이 두 배가
    #   되고, data/sd/ 518파일을 하루 두 번 커밋해 저장소가 두 배로 분다.
    # ⚠ 이 cron 문자열을 바꾸면 build/should_refresh.py 의 BACKUP_CRONS 도 같이 바꿀 것.
    #   (2026-08-12 부터 validate_site.py 가 그 표와 이 파일을 대조한다 — 어긋나면 빨개진다.)
    - cron: '42 22 * * 0-5'    # 백업 슬롯 — 매일(월~토) 07:42 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stocks
  cancel-in-progress: false

jobs:
  # 백업 슬롯이 헛돌지 않게 하는 값싼 판정 잡(체크아웃 + 파이썬 한 번, 20초대).
  # 본 슬롯·수동 실행은 무조건 통과시키고, 백업 슬롯일 때만 오늘치 커밋 유무를 본다.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # 얕은 클론이면 stocks.json 을 건드린 마지막 커밋이 범위 밖일 수 있다. 그때는
      # should_refresh 가 '오늘 안 돎'으로 보고 도는 쪽을 택한다 — 안전한 방향이다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: decide
        run: |
          python build/should_refresh.py data/stocks.json \
            "${{ github.event_name }}" "${{ github.event.schedule }}" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 15개 워크플로 중 유일하게 없었다 — 기본 360분이라 Yahoo 쓰로틀 재시도가 붙으면
    # 몇 시간을 물고 있는다. 실측 실행시간은 10년 패널에서도 3분대다.
    # 2026-07-31: 30 → 45. 시가총액 결손 직렬 재수집(최대 250종)이 붙는 날은 그 루프에만
    #   MC_RETRY_BUDGET_S=7분을 쓴다. 30분 컷은 '2단 폴백으로 성공했을 실행'을 잘라
    #   그날치 수집물과 소급 불가 누적물(target_history·fund_history)까지 버리게 만든다.
    #   시간 상한의 1차 방어선은 잡 타임아웃이 아니라 코드의 예산이다(refresh_stocks.py).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        # 🚨 2026-08-19 — --prefer-binary. lxml 6.1.2 가 wheel 없이 올라와
        #   pip 이 소스 빌드로 넘어갔고 러너에 libxml2-dev 가 없어 죽었다
        #   (yfinance 의 전이 의존이라 우리가 부르지도 않는 패키지다).
        #   ⚠ 판을 손으로 박지 않는다 — 박은 수는 낡는다. wheel 이 있는 최신 판을
        #     고르게 두면 벤더가 wheel 을 올리는 대로 저절로 따라간다.
        run: pip install --prefer-binary --quiet pandas numpy yfinance
      # 🚨 2026-08-05 — 기준선. 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지
      #   잰다. 이게 없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는
      #   결함 때문에 방금 받은 자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Compute technical signals
        run: python build/refresh_stocks.py
      # 🚨 2026-08-15 — **받은 자리에서 바로 구멍을 메운다.** 이 잡이 CI 에서 막힌 사유가
      #   이것이다: 배치 다운로드가 조용히 행을 빠뜨려 한 날짜에 29종이 비었고(정상일은
      #   0~1종), 관문이 "수집 실패" 로 잡아 그날 받은 자료를 통째로 버렸다. 메우는
      #   스크립트는 진작 있었는데(2026-08-14) **이 워크플로가 안 부르고 있었다** —
      #   이 저장소가 되풀이 밟는 '수집했는데 배선 안 함' 이다.
      # ⚠ None 인 칸만 채운다(patch_px_holes 머리말). 값이 있는 칸은 안 덮으므로 두 번째
      #   가격 원천이 되지 않는다.
      # ⚠ 실패해도 잡을 세우지 않는다. 못 메우면 아래 관문이 어차피 막는다 — 여기서 죽으면
      #   그날 받은 나머지(분할·주식수·시그널)까지 같이 버린다.
      - name: Fill price-grid holes
        run: python build/patch_px_holes.py
        continue-on-error: true
      # 주식분할 이력 — 전략 랩이 '당시 보고 주식수 → 오늘 기준'으로 되맞추는 데 쓴다
      # (build/tech_backtest.py 의 _rebase). 여기가 제자리다: 같은 yfinance 세션이고,
      # 전략 랩 잡(토 07:50)보다 먼저 도는 잡이라 그 입력이 늘 최신이다.
      # ⚠ 이 파일이 없으면 되맞추기가 꺼지고 예전처럼 잘라낸다 — 조용히 표본이 짧아진다.
      - name: Collect split history
        run: python build/refresh_splits.py
      # SEC 로 주식수를 못 만드는 종목만 yfinance 로 메운다(실측 6종 — 다중클래스).
      # data/fx 를 훑어 대상을 스스로 정하므로 명단을 손으로 관리하지 않는다.
      # ⚠ 대상이 40종을 넘으면 SEC 수집이 깨진 것으로 보고 스스로 실패한다 —
      #   조용히 다른 출처로 갈아타면 정의가 다른 숫자가 섞인다.
      - name: Fill missing share counts (yfinance)
        run: python build/refresh_shares_yf.py
      # 지표별 타이밍 신호 — 성적표는 3년 표본이라 천천히 바뀌지만 '오늘 발동 종목'은 매일 바뀐다.
      # 그래서 별도 주간 잡이 아니라 여기 붙인다(sd/ 가 방금 갱신된 직후여야 같은 기준일이 된다).
      - name: Measure indicator timing signals
        run: python build/signal_lab.py
      # 홈은 원본 대신 슬림 묶음(build/home_flow.py)을 읽는다 — 원본이 바뀌면 같이 다시 굽는다.
      # 빠뜨리면 홈만 옛 데이터를 말하고 아무도 알려주지 않는다.
      - name: Rebuild home slim bundle
        run: python build/home_flow.py
      # 스타일별 상위 10종목(data/style_top.json) — 홈 스타일 표 아래 '구성종목' 줄의 원본.
      # ⚠ 이 단계가 **없어서 그 파일이 2026-07-28 에 고착돼 있었다.** 어느 워크플로도
      #   build/style_top.py 를 부르지 않았고(refresh-assets 가 부르는 것은 style_top_pdf.py
      #   --json 으로, 그건 style_perf/style_trails 만 낸다), 홈은 07-31 성과 행 옆에
      #   07-28 구성종목을 나란히 놓고 있었다. 여기가 제자리다 — 입력인 stocks.json 과
      #   data/sd/ 를 방금 이 잡이 만들었고 numpy 도 이미 깔려 있다.
      #   (assets.json 의 SPY 는 베타용인데 날짜 교집합으로 맞추므로 하루 차이는 무해하다.)
      - name: Rebuild style top holdings
        run: python build/style_top.py
      # 전 전략 통합 목록 — 원본(tech·asset·archive·deploy)이 바뀌면 같이 다시 굽는다.
      # 빠뜨리면 전략 랩만 옛 목록을 보여주고 아무도 알려주지 않는다.
      # 🚨 2026-08-15 — **'지금 보유' 는 매일 낡는다.** 성과는 전월말 기준이라 한 달 안에서
      #   안 바뀌지만(asof_cut) 보유 명단은 다르다 — 타이밍 22종은 매일, 주간 리밸 8종은
      #   매주 갈아탄다. 랩 본편(tech_backtest)은 주 1회·월 1회만 돌므로 그 사이 화면이
      #   최대 한 달 묵은 명단을 '지금 보유' 라고 말하게 된다.
      #   랩 본편은 20분이지만 보유만 다시 뽑는 것은 **12초**다(실측) — 주기가 다른 두 가지를
      #   한 잡에 묶어 두었던 것이 문제였다. 성과는 월 1회, 보유는 매일.
      # ⚠ holdings 칸만 덮는다. metrics·nav·chart 는 안 건드린다(그건 전월말 기준이다).
      # ⚠ **strategy_index 앞에 둔다.** 그 빌더가 tech_strategies.json 의 holdings 를
      #   읽어 화면 페이로드로 옮긴다 — 뒤에 두면 화면은 옛 명단을 그대로 받는다.
      - name: Refresh current holdings
        run: python build/refresh_holdings_now.py
        continue-on-error: true
      # 🚨 2026-08-18 — 페어 랩이 **어느 잡에도 없었다**(audit_unbuilt.py 가 찾음).
      #   입력은 매일 갱신되는 stocks.json 인데 산출물은 손으로만 구워서, 화면에 실린
      #   페어 전략 카드가 마지막으로 구운 날에 멈춰 있었다(실측 나흘). 잡이 죽지도
      #   않고 화면도 아무 말을 안 한다 — 랩이 되풀이하는 «수집만 하고 배선 안 함» 이다.
      # ⚠ **strategy_index 앞에 둔다.** 그 빌더가 pairs_strategies.json 을 읽어 화면
      #   페이로드로 옮긴다 — 뒤에 두면 화면은 옛 성과를 그대로 받는다.
      #   (바로 위 refresh_holdings_now 를 앞에 둔 것과 같은 이유다.)
      # ⚠ numpy 말고는 의존이 없고 35초다(실측) — 일간 잡에 얹어도 무겁지 않다.
      - name: Rebuild pairs lab
        run: python build/pairs_backtest.py
      - name: Rebuild unified strategy index
        run: python build/strategy_index.py
      # 랩 상세 차트는 목록과 분리된 지연 로딩 파일이다 — 목록만 다시 굽고 이걸 빠뜨리면
      # 새 전략이 화면에서 '차트 없는 전략'으로 보인다.
      - name: Rebuild lab charts
        run: python build/strategy_charts.py
      # 🚨 지수 편입 원장은 **가격 격자를 세어 커버리지를 박아 둔다**(src_fp). 격자가
      #   하루 늘거나 결손 수가 바뀌면 그 수가 조용히 낡고, 관문의 지문 검사가 막는다.
      #   실제로 CI 가 여기서 걸렸다(grid_days 4430 ≠ 4431 · px_nulls 2 ≠ 31).
      #   가격을 만지는 잡이면 원장도 같이 구워야 한다 — 그게 지문 검사를 넣은 이유다.
      - name: Rebuild index membership ledger
        run: python build/index_ledger.py
      - name: Rebuild as-of index
        # 기준일 정본(data/asof.json)은 원본이 바뀔 때마다 다시 구워야 한다.
        # 안 그러면 전 페이지 내비 칩이 어제 날짜를 말하고, validate_site.py의
        # '기준일 정본 불일치' 검사가 다음 실행에서 잡을 실패시킨다.
        run: python build/asof_index.py
      # ⚠ 생성기 산출물 전부 넘긴다: stocks.json(슬림)·home_reco.json·data/sd/(종목별 상세, 삭제 포함)
      #   + target_history.json·fund_history.json(누적 이력 — 커밋 안 하면 매 실행 fresh checkout이라 영구 유실)
      #   하나라도 빠지면 해당 화면이 낡은 채 고착된다(home_reco 누락 사고의 교훈).
      #   빠뜨림은 ci_push.sh의 누락 가드가 data/ 전체를 훑어 잡는다.
      # 🚨 2026-08-14 — home_ind_perf.json 이 빠져 있어 **이 잡이 이틀 죽었다.**
      #   refresh_stocks.py 가 home_summary.write() 를 부르는데 그 산출물이 둘이다
      #   (home_stocks.json + home_ind_perf.json). 목록에 하나만 있어서 누락 가드가 물었고,
      #   가드는 커밋 스텝 전체를 세우므로 stocks.json·sd/ 518종까지 **하나도 안 올라갔다**.
      #   화면이 08-12 에 고착된 것이 그 결과다. 부르는 빌더가 내는 파일을 다 적을 것.
      # 🚨 2026-08-05 추가 — 이 잡만 Validate 단계가 없었다. 봇 커밋에는 CI 가 안 돌므로
      #   이 잡의 산출물(stocks.json·data/sd/ 518종·home_reco 등 랩 입력 전부)은 아무도
      #   검증하지 않은 채 배포되고 있었다. validate_site 에 그것을 잡는 가드가 있었는데,
      #   위 주석에 'validate_site.py' 라는 글자가 있어서 substring 검사를 통과했다.
      - name: Validate
        run: python build/validate_gate.py check
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 종목 테크니컬 시그널 자동 갱신" \
            data/stocks.json data/home_reco.json data/home_stocks.json data/sd data/target_history.json data/fund_history.json \
            data/signal_lab.json data/home_flow.json data/style_top.json data/splits.json data/shares_yf.json \
            data/home_ind_perf.json \
            data/strategy_index.json data/strategy_charts.json data/asof.json data/index_ledger.json data/tech_strategies.json data/pairs_strategies.json data/pairs_book.json
      # 갱신이 '돌았는데 낡은 데이터'면 잡을 실패시켜 GitHub 기본 실패 알림 메일이 소유자에게 가게 한다.
      #   커밋 스텝 뒤라 데이터는 이미 남기고(있는 만큼 최선), 잡만 빨갛게 만든다.
      #   '아예 안 뜬' 케이스는 이걸로 못 잡으니 sources.html 신선도 배지가 상보적으로 드러낸다.
      - name: Verify freshness
        run: python build/check_freshness.py data/stocks.json "종목 시그널" 2
