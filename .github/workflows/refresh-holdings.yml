name: Refresh strategy holdings (free data)

# 월말 리밸런스 구성이라 월 1회면 충분 — 매월 2일 09:10 KST(월말 종가 확정 후 여유).
# ⚠ 데이터 정책: build/refresh_holdings.py는 yfinance(무료)만 사용 — 라이선스 데이터 파생 보유는 공개 금지.
on:
  schedule:
    - cron: '5 22 1 * *'    # 매월 2일 07:05 KST (UTC 자정 前이라 일자는 1)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-holdings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet pandas numpy yfinance
      # 🚨 2026-08-05 — 기준선. 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지
      #   잰다. 이게 없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는
      #   결함 때문에 방금 받은 자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Compute holdings
        run: python build/refresh_holdings.py
      - name: Validate
        run: python build/validate_gate.py check
      # 이 잡은 asof 축을 건드리지 않아 asof.json을 넘기지 않는다(넘긴 잡만 리베이스 뒤 다시 굽는다).
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 현재 포트폴리오 구성 자동 갱신 (무료 데이터 3전략)" \
            data/strategy_holdings.json
      # 🚨 2026-08-16 점검에서 이 잡에 신선도 게이트가 없던 것을 찾았다. 관문(validate_gate)은
      #   «자료가 깨졌나» 를 보지 «잡이 돌았는데 안 움직였나» 를 안 본다. 크론이 조용히
      #   드롭되면 잡은 초록인데 산출물만 낡는다 — check_freshness.py 가 그것 때문에 있다.
      #   매월 2일 1회라 한 달(약 22영업일)이 정상 간격이다. 25 를 넘으면 한 달을 통째로 걸렀다는 뜻.
      - name: Verify freshness
        run: python build/check_freshness.py data/strategy_holdings.json "현재 포트폴리오 구성" 25 --key generated
