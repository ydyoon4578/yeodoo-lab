name: Refresh strategy holdings (free data)

# 월말 리밸런스 구성이라 월 1회면 충분 — 매월 1일 08:25 KST(+2일 백업 슬롯, cron 신뢰성).
# ⚠ 데이터 정책: build/refresh_holdings.py는 yfinance(무료)만 사용 — 라이선스 데이터 파생 보유는 공개 금지.
on:
  schedule:
    - cron: '55 23 1 * *'    # 매월 1일 08:55 KST (전일 23:55 UTC)
    - cron: '55 23 2 * *'    # 매월 2일 백업
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-holdings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet pandas numpy yfinance
      - name: Compute holdings
        run: python build/refresh_holdings.py
      - name: Validate
        run: python build/validate_site.py
      # 이 잡은 asof 축을 건드리지 않아 asof.json을 넘기지 않는다(넘긴 잡만 리베이스 뒤 다시 굽는다).
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 현재 포트폴리오 구성 자동 갱신 (무료 데이터 3전략)" \
            data/strategy_holdings.json
