name: Refresh asset panel & archive re-check

# 멀티에셋 패널(ETF·FRED·연준 EBP)을 받아, 아카이브가 '재현 불가'로 두었던 전략들을 실제로 돌린다.
#
# 2026-07-30 주 1회 → 매일(월~토 KST). 왜 바꿨나 —
#   원래 근거는 "입력이 일봉이고 표본이 15~19년이라 하루로는 **판정이** 안 바뀐다" 였고 그건
#   지금도 맞다(ml·아카이브 재검은 대개 no-op 이라 커밋도 안 생긴다). 그런데 이 잡의 산출물에
#   **market_board.json(다기간 성과 보드)** 이 얹혀 있고, 홈 스타일 표가 그 ETF 행을 랩 행과
#   짝지어 보여주게 됐다. 랩 쪽 원천(stocks.json)은 매일 갱신이라 주 1회로 두면 두 행의
#   기준일이 최대 5일 갈리고, **1일 수익률 열은 서로 다른 날을 비교**하게 된다(사용자 지적).
#   판정용 주기가 아니라 표시용 주기에 맞춰야 하는 산출물이 생긴 것이다.
#   자산 패널 writer 를 하나로 유지하려고 이 잡 자체를 매일로 돌린다 — 일간 잡에 패널 갱신을
#   따로 얹으면 4MB assets.json 을 두 잡이 쓰게 되어 머지 충돌이 난다.
#
# 순서 — 종목 패널(refresh-stocks, 21:50 UTC)보다 뒤여야 한다. 이 잡의 style_top_pdf --json 이
#   stocks.json 을 읽으므로, 앞서면 랩 쪽이 하루 낡은 채로 굳는다. 23:40 UTC = 그 1시간 50분 뒤.
#
# 무게 — yfinance 50종목 20년 + FRED 18계열. 전체 실측 2~8분.
#
# ⚠ 13F 이력 수집은 refresh-13f-history.yml 로 **분리**했다. 여기 얹혀 있던 동안 이 잡의 뒤쪽
#   단계가 죽을 때마다(커밋이 마지막에 한 번뿐이라) 몇 분짜리 SEC 수집이 통째로 버려졌다 —
#   네 번 연속, 매번 13F 와 무관한 사유로. 이 잡의 ml_backtest 는 그 산출물을 읽기만 한다.
#
# 2026-07-31: 같은 결합이 이 잡 **안에** 또 있었다. ML 단계(26~29분)가 앞에 있고 커밋이
#   마지막 한 번뿐이라, ML 이 죽으면 이미 성공한 자산 패널·시장판·스타일 성과가 통째로
#   버려졌다(그날 두 번: 푸시 충돌 · 30분 타임아웃).
#   → 커밋을 **두 번**으로 나눴다. 1부(수집·표시, 2~3분)를 먼저 커밋하고, 2부(연구, 26~29분)를
#     그 뒤에 둔다. 워크플로를 쪼개지 않은 이유는 아래 1부 주석에 적었다.

on:
  schedule:
    - cron: '40 23 * * 0-5'  # 매일(월~토) 08:40 KST — refresh-stocks(06:50)보다 뒤
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 2026-07-31: 30 → 60. ML 단계가 하루 만에 1.4분 → 26~29분이 됐다(랜덤 포레스트 종목선택
    #   0238f71a + 특징 20개 2×2 be30349e, 둘 다 07-30 오후). 11:30 실행이 정확히 30분에서 잘렸다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet pandas numpy yfinance

      # ══ 1부: 수집·표시 (실측 2~3분) ══════════════════════════════════════
      # 🚨 이 부분을 **먼저 커밋한다**. 예전엔 무거운 ML 단계가 앞에 있고 커밋이 마지막 한 번뿐이라,
      #   ML 이 죽으면(07-31 두 번: 푸시 충돌 · 30분 타임아웃) 이미 성공한 자산 패널·시장판·
      #   스타일 성과가 **통째로 버려졌다**. 13F 를 별도 워크플로로 뗀 것과 같은 결합이다.
      #   여기서는 워크플로를 쪼개는 대신 순서를 바꿨다 — 쪼개면 새 크론 슬롯과 잡 간 커밋 경합이
      #   생기고, ML 이 오늘 패널이 아니라 어제 패널을 보게 된다. 순서만 바꾸면 셋 다 안 생긴다.
      - name: Fetch asset panel
        run: python build/refresh_assets.py
      # ⚠ asset_backtest 는 ml_strategies.json 을 읽는다. 1부에서는 **어제 것**을 읽고,
      #   ML 이 갱신한 뒤 2부에서 다시 돌려 오늘 것으로 맞춘다. 1부만 커밋된 상태도
      #   그 자체로 정합적이다(그 시점 트리에 있던 ml 파일로 돌린 결과다).
      - name: Re-run archived strategies
        run: python build/asset_backtest.py
      # 전 전략 통합 목록 — 원본(tech·asset·archive·deploy)이 바뀌면 같이 다시 굽는다.
      # 빠뜨리면 전략 랩만 옛 목록을 보여주고 아무도 알려주지 않는다.
      - name: Rebuild unified strategy index
        run: python build/strategy_index.py
      # 랩 상세 차트는 목록과 분리된 지연 로딩 파일이다 — 목록만 다시 굽고 이걸 빠뜨리면
      # 새 전략이 화면에서 '차트 없는 전략'으로 보인다.
      - name: Rebuild lab charts
        run: python build/strategy_charts.py
      # 다기간 성과 보드(섹터·스타일·금리·크레딧) — 자산 패널에서 계산한다.
      # 패널이 갱신됐는데 이걸 빠뜨리면 보드만 지난주 숫자를 말하고 아무도 알려주지 않는다.
      - name: Rebuild market board
        run: python build/market_board.py
      # 랩 스타일 성과 — 홈 표가 ETF 행 옆에 이 값을 병기한다. **market_board 바로 뒤**에
      # 두는 것이 요점이다: 같은 잡·같은 커밋에서 나와야 두 행의 기준일이 갈리지 않는다.
      # --json 은 matplotlib·한글 폰트 없이 도는 경로다 — 러너에 폰트를 얹지 않으려는 것.
      - name: Rebuild lab style performance
        run: python build/style_top_pdf.py --json
      # 홈 달력의 '그날 지수 등락률'은 assets.json 의 ^GSPC·^NDX 종가로 만든다(build/home_flow.py:177).
      # 그런데 home_flow 를 부르는 잡은 전부 이 잡보다 **먼저** 돈다(stocks 06:50 · earnings 07:00 ·
      # filings 07:40 · insider 08:00 · 13f 08:20 / 이 잡 08:40). 그래서 그 잡들이 만든 home_flow 는
      # 언제나 어제 자 assets 로 만들어졌고, 달력에서 가장 강조되는 칸(기준일)의 등락률만
      # 매일 비어 있었다 — 과거 칸엔 뜨는데 오늘 칸만 빈다. assets 를 새로 만든 **이 자리에서**
      # 다시 구워야 그 칸이 채워진다. ⚠ asof_index 보다 앞이어야 한다(as_of 를 읽어 간다).
      - name: Rebuild home flow (calendar day returns)
        run: python build/home_flow.py
      - name: Rebuild as-of index
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_site.py
      - name: Commit collected & display outputs
        run: |
          bash build/ci_push.sh "chore(data): 자산 패널·시장판·스타일 성과 자동 갱신" \
            data/assets.json data/asset_strategies.json \
            data/strategy_index.json data/strategy_charts.json \
            data/market_board.json data/style_perf.json data/style_trails.json \
            data/home_flow.json data/asof.json
      # 신선도는 1부 직후에 본다 — 2부가 죽어도 '패널이 낡았나'는 답이 나와야 한다.
      - name: Verify freshness
        run: python build/check_freshness.py data/assets.json "자산 패널" 10

      # ══ 2부: 연구 (실측 26~29분) ═════════════════════════════════════════
      # 여기서부터 죽어도 위에서 그날치는 이미 커밋됐다. 잡은 빨간불이 되고(옳다),
      # 사유는 build/gate.py 가 체크런 주석에 남긴다.
      - name: Run ML & clone (pre-registered protocol)
        run: python build/ml_backtest.py
      - name: Re-run archived strategies (with today's ML)
        run: python build/asset_backtest.py
      - name: Rebuild unified strategy index (with today's ML)
        run: python build/strategy_index.py
      - name: Rebuild lab charts (with today's ML)
        run: python build/strategy_charts.py
      - name: Rebuild as-of index (with today's ML)
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_site.py
      - name: Commit research outputs
        run: |
          bash build/ci_push.sh "chore(data): ML 사전등록 검정·아카이브 재검 자동 갱신" \
            data/ml_strategies.json data/asset_strategies.json \
            data/strategy_index.json data/strategy_charts.json data/asof.json
