name: Refresh asset panel & archive re-check

# 멀티에셋 패널(ETF·FRED·연준 EBP)을 받아, 아카이브가 '재현 불가'로 두었던 전략들을 실제로 돌린다.
#
# 2026-07-30 주 1회 → 매일(월~토 KST). 왜 바꿨나 —
#   원래 근거는 "입력이 일봉이고 표본이 15~19년이라 하루로는 **판정이** 안 바뀐다" 였고 그건
#   지금도 맞다(ml·아카이브 재검은 대개 no-op 이라 커밋도 안 생긴다). 그런데 이 잡의 산출물에
#   **market_board.json(다기간 성과 보드)** 이 얹혀 있고, 홈 스타일 표가 그 ETF 행을 랩 행과
#   짝지어 보여주게 됐다. 랩 쪽 원천(stocks.json)은 매일 갱신이라 주 1회로 두면 두 행의
#   기준일이 최대 5일 갈리고, **1일 수익률 열은 서로 다른 날을 비교**하게 된다(사용자 지적).
#   판정용 주기가 아니라 표시용 주기에 맞춰야 하는 산출물이 생긴 것이다.
#   자산 패널 writer 를 하나로 유지하려고 이 잡 자체를 매일로 돌린다 — 일간 잡에 패널 갱신을
#   따로 얹으면 4MB assets.json 을 두 잡이 쓰게 되어 머지 충돌이 난다.
#
# 순서 — 종목 패널(refresh-stocks, 21:50 UTC)보다 뒤여야 한다. 이 잡의 style_top_pdf --json 이
#   stocks.json 을 읽으므로, 앞서면 랩 쪽이 하루 낡은 채로 굳는다. 23:40 UTC = 그 1시간 50분 뒤.
#
# 무게 — yfinance 50종목 20년 + FRED 18계열. 전체 실측 2~8분.
#
# ⚠ 13F 이력 수집은 refresh-13f-history.yml 로 **분리**했다. 여기 얹혀 있던 동안 이 잡의 뒤쪽
#   단계가 죽을 때마다(커밋이 마지막에 한 번뿐이라) 몇 분짜리 SEC 수집이 통째로 버려졌다 —
#   네 번 연속, 매번 13F 와 무관한 사유로. 이 잡의 ml_backtest 는 그 산출물을 읽기만 한다.
#
# 2026-07-31: 같은 결합이 이 잡 **안에** 또 있었다. ML 단계(26~29분)가 앞에 있고 커밋이
#   마지막 한 번뿐이라, ML 이 죽으면 이미 성공한 자산 패널·시장판·스타일 성과가 통째로
#   버려졌다(그날 두 번: 푸시 충돌 · 30분 타임아웃).
#   → 커밋을 **두 번**으로 나눴다. 1부(수집·표시, 2~3분)를 먼저 커밋하고, 2부(연구, 26~29분)를
#     그 뒤에 둔다. 워크플로를 쪼개지 않은 이유는 아래 1부 주석에 적었다.
#
# 2026-08-03: 순서를 바꾸는 것으로는 부족했다. 패널이 1.76배가 되자(7f3402d) ML 이 56분
#   안팎이 되어 **60분 잡 타임아웃에 두 번 연속 잘렸다**(정기 01:09 · 수동 02:55).
#   1부는 매번 멀쩡히 커밋됐으니 07-31 의 분리는 제 일을 했지만, 2부는 그날 이후 한 번도
#   못 돌았다 — ml_strategies.json 이 08-01 에 멈춰 있었다.
#   → 2부를 **refresh-ml.yml 로 뗐다.** 한 잡에 2~3분과 56분을 같이 두면 예산을 어느
#     쪽에 맞춰도 한쪽이 손해다. 이 잡은 다시 '수집·표시' 하나만 한다.

on:
  schedule:
    - cron: '34 22 * * 0-5'  # 본 슬롯 — 매일(월~토) 07:34 KST · refresh-stocks(06:50)보다 뒤
    # 🚨 2026-08-12 백업 슬롯 추가. GitHub 스케줄 크론은 드롭이 잦은데 이 잡만 무방비였다.
    #   실측 08-11: 본 슬롯이 **아예 발화하지 않아** 시장판·스타일 성과가 하루 고착했고,
    #   다음 날 사용자가 "기간별 수익률 업데이트가 늦네"로 알아챌 때까지 아무도 몰랐다.
    #   refresh-stocks 는 07-21 고착 사고 뒤 같은 보호를 이미 받고 있었다 — 그 차이가
    #   그날 하루를 갈랐다.
    # ⚠ 08:20 인 이유: refresh-stocks 백업(07:42)이 끝난 뒤여야 한다(실측 13분 → ~07:55).
    #   본 슬롯보다 앞서면 어제 종목 자료로 패널을 굽는다.
    # ⚠ 이 cron 문자열을 바꾸면 build/should_refresh.py 의 BACKUP_CRONS 도 같이 바꿀 것.
    #   안 바꾸면 백업이 '본 슬롯'으로 판정되어 **매일 두 번** 돈다.
    - cron: '20 23 * * 0-5'  # 백업 슬롯 — 매일(월~토) 08:20 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-assets
  cancel-in-progress: false

jobs:
  # 백업 슬롯이 헛돌지 않게 하는 값싼 판정 잡(체크아웃 + 파이썬 한 번, 20초대).
  # 본 슬롯·수동 실행은 무조건 통과시키고, 백업 슬롯일 때만 오늘치 커밋 유무를 본다.
  # (refresh-stocks.yml 의 같은 잡과 한 글자도 다르지 않다 — 판정은 should_refresh 가 한다.)
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # 얕은 클론이면 assets.json 을 건드린 마지막 커밋이 범위 밖일 수 있다. 그때는
      # should_refresh 가 '오늘 안 돎'으로 보고 도는 쪽을 택한다 — 안전한 방향이다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: decide
        run: |
          # 🚨 --behind 는 «내 산출물이 내 입력보다 뒤처졌나» 다(2026-08-19).
          #   이 잡의 뒷단계(style_top_pdf·market_board·home_perf)는 stocks.json 을
          #   읽는데 게이트는 assets.json 만 봤다. 08-19 에 refresh-stocks 가 실패→재시도
          #   하는 사이 이 잡이 먼저 돌아 08-17 격자로 스타일을 계산했고, 백업 슬롯은
          #   «오늘 이미 갱신됐다» 며 건너뛰어 스타일만 하루 뒤처진 채 굳었다.
          python build/should_refresh.py data/assets.json \
            "${{ github.event_name }}" "${{ github.event.schedule }}" \
            --behind=data/style_perf.json:data/stocks.json >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 2026-07-31: 30 → 60. ML 단계가 하루 만에 1.4분 → 26~29분이 됐다(랜덤 포레스트 종목선택
    #   0238f71a + 특징 20개 2×2 be30349e, 둘 다 07-30 오후). 11:30 실행이 정확히 30분에서 잘렸다.
    # 2026-08-03: 60 → 25. ML 을 refresh-ml.yml 로 뗐다(아래 '2부' 주석). 남은 것은 수집·표시뿐
    #   이고 실측 2~3분이다 — 패널 다운로드 72초가 그중 대부분이다. 25분은 러너가 느린 날과
    #   패널이 더 자랄 여지를 둔 값이다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet pandas numpy yfinance

      # ══ 수집·표시 (실측 2~3분) ═══════════════════════════════════════════
      # (2026-08-03 까지 '1부'였다. 2부는 refresh-ml.yml 로 나갔다 — 아래 꼬리말 참조.)
      # 🚨 이 부분을 **먼저 커밋한다**. 예전엔 무거운 ML 단계가 앞에 있고 커밋이 마지막 한 번뿐이라,
      #   ML 이 죽으면(07-31 두 번: 푸시 충돌 · 30분 타임아웃) 이미 성공한 자산 패널·시장판·
      #   스타일 성과가 **통째로 버려졌다**. 13F 를 별도 워크플로로 뗀 것과 같은 결합이다.
      #   여기서는 워크플로를 쪼개는 대신 순서를 바꿨다 — 쪼개면 새 크론 슬롯과 잡 간 커밋 경합이
      #   생기고, ML 이 오늘 패널이 아니라 어제 패널을 보게 된다. 순서만 바꾸면 셋 다 안 생긴다.
      # 🚨 2026-08-05 — 기준선. 이 잡도 08-05 새벽에 자산 패널을 다 받아 놓고
      #   아래 Validate 에서 죽어 전부 버렸다. 무엇을 재는지는 validate_gate.py 참고.
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Fetch asset panel
        run: python build/refresh_assets.py
      # 🚨 2026-08-05 — 종전에는 asset_backtest 가 ml_strategies.json 을 읽어서, ML 워크플로와
      #   이 잡 사이에 '1부는 어제 것 · 2부는 오늘 것' 이라는 순서 결합이 있었다. ML 랩을
      #   삭제하면서 그 결합이 사라졌다(build/DATA-FACTS.md 17번). 13F 복제만 남았고
      #   그것은 여기서 바로 앞에 돌린다 — 0.4초라 별 워크플로로 뗄 이유가 없다.
      # ⚠ 성과 기준일 = **전월말**(2026-08-14 사용자 지시 · tech_backtest.asof_cut).
      #   아래 두 단계는 그래서 한 달 안에서는 매일 돌아도 **같은 값**을 낸다 — 커밋이 안
      #   생기므로 낭비가 아니고, 달이 넘어간 첫날 자동으로 갱신된다.
      #   ⚠ 이 잡을 월 1회로 내리지 **않는다.** 위쪽 refresh_assets.py(자산 패널)와
      #     아래 market_board.py 는 매일 바뀌는 자료이고, 그것이 홈 달력·지수 등락률을
      #     채운다. 여기를 월 1회로 만들면 그쪽이 같이 멎는다.
      - name: Rebuild 13F conviction clone
        run: python build/guru_clone.py
      - name: Re-run archived strategies
        run: python build/asset_backtest.py
      # 🚨 판정 원장은 asset_strategies 를 읽는다. 이 잡이 그 파일을 다시 굽는데 원장을
      #   안 구우면 둘이 어긋나 validate 가 막고, 관문이 잡 전체를 세운다 —
      #   그러면 assets.json 이 커밋되지 못해 **홈 달력의 지수 등락률까지 빈다**
      #   (2026-08-07·08-08 이틀 연속 그렇게 죽었다. refresh-tech 에는 이 단계가 있었다).
      - name: Rebuild verdict ledger
        run: python build/verdicts_gen.py
      # 전 전략 통합 목록 — 원본(tech·asset·archive·deploy)이 바뀌면 같이 다시 굽는다.
      # 빠뜨리면 전략 랩만 옛 목록을 보여주고 아무도 알려주지 않는다.
      - name: Rebuild unified strategy index
        run: python build/strategy_index.py
      # 랩 상세 차트는 목록과 분리된 지연 로딩 파일이다 — 목록만 다시 굽고 이걸 빠뜨리면
      # 새 전략이 화면에서 '차트 없는 전략'으로 보인다.
      - name: Rebuild lab charts
        run: python build/strategy_charts.py
      # 복제 리포트는 랩 세 파일에서 값을 **옮긴** 것이다. 랩만 갱신되고 이걸 빠뜨리면
      # 같은 사이트의 두 화면이 다른 날짜·다른 t 를 말한다 — '채점기가 두 벌' 이다.
      # validate_site 가 기준일을 대조해 막지만, 막히기 전에 여기서 같이 굽는 것이 맞다.
      - name: Rebuild strategy replication report
        run: python build/strategy_report.py
      # 다기간 성과 보드(섹터·스타일·금리·크레딧) — 자산 패널에서 계산한다.
      # 패널이 갱신됐는데 이걸 빠뜨리면 보드만 지난주 숫자를 말하고 아무도 알려주지 않는다.
      - name: Rebuild market board
        run: python build/market_board.py
      # 홈 표 위의 시계열. 🚨 market_board **뒤**여야 한다 — 이 스크립트가 그 파일의
      #   기준일자(basis.base_dates)를 읽어 같은 기준으로 경로를 만든다. 앞에 두면
      #   어제 기준일로 그린 선이 오늘 표 위에 놓여 끝값이 표와 어긋난다.
      - name: Rebuild home performance series
        run: python build/home_perf.py
      # 🚨 2026-08-19 — 섹터·세부섹터 판(data/sector_panel.json). **home_perf 바로 뒤**에 둔다:
      #   이 빌더는 섹터 줄을 스스로 계산하지 않고 home_perf.json 의 섹터 ETF 수치를 그대로
      #   옮긴다(따로 계산하면 같은 섹터가 두 화면에서 다른 수가 된다). 앞에 두면 어제 값을 옮긴다.
      # ⚠ 산업그룹은 stocks.json·data/sd·members.json 으로 만든다 — 그 셋은 refresh-stocks(06:50)가
      #   이 잡(07:34)보다 먼저 갱신하므로 여기서는 이미 오늘 것이다.
      - name: Rebuild sector / industry-group panel
        run: python build/sector_panel.py
      # 랩 스타일 성과 — 홈 표가 ETF 행 옆에 이 값을 병기한다. **market_board 바로 뒤**에
      # 두는 것이 요점이다: 같은 잡·같은 커밋에서 나와야 두 행의 기준일이 갈리지 않는다.
      # --json 은 matplotlib·한글 폰트 없이 도는 경로다 — 러너에 폰트를 얹지 않으려는 것.
      - name: Rebuild lab style performance
        run: python build/style_top_pdf.py --json
      # 🚨 편출 종목 가격을 **자동으로** 이어 붙인다(2026-08-19). 전날 이 기록을 커밋하며
      #   «편출 가격은 안 바뀌니 새 이름이 생길 때만 손으로» 라고 적었는데 전제가 틀렸다 —
      #   154종 중 143종이 «지수에서 빠졌을 뿐 지금도 거래되는» 회사라 매일 낡는다.
      #   그리고 이 이름들은 랩의 어느 일간 피드에도 없다(stocks·assets·sd 전부 0종).
      # ⚠ style_pit **앞에** 둔다 — 그 빌더가 이 기록을 읽는다.
      - name: Top up delisted price record
        run: python build/pit_px_refresh.py
        continue-on-error: true
      # 🚨 2026-08-19 — style_pit 을 러너로 들여왔다. 종전에는 «가격 캐시가 gitignore 라
      #   러너가 못 굽는다» 며 손으로만 돌렸고, 그래서 stocks 가 갱신된 날마다 style.html
      #   캐비엇의 «보정 전» 수치가 같은 화면의 표와 다른 날을 가리켰다(검사기가 만성 경고).
      #   구조가 아니라 형식 문제였다 — 편출 종목 154개의 가격을 날짜 배열 한 벌 +
      #   구간 배열로 담으니 10.6MB → 3.8MB 이고, 편출 가격은 앞으로 바뀌지도 않는다.
      #   그래서 data/pit_px.json 으로 커밋하고 여기서 읽는다(build/pit_px_emit.py 가 만든다).
      # ⚠ **style_top_pdf 뒤에 둔다.** style_pit 이 그 산출물(style_perf.json)을 앵커로
      #   대조해 «편향이 아니라 계산 변경» 을 걸러낸다 — 앞에 두면 어제 값과 대조하게 된다.
      - name: Rebuild lab style PIT (bias legs)
        run: python build/style_pit.py
      # 홈 달력의 '그날 지수 등락률'은 assets.json 의 ^GSPC·^NDX 종가로 만든다(build/home_flow.py:177).
      # 그런데 home_flow 를 부르는 잡은 전부 이 잡보다 **먼저** 돈다(stocks 06:50 · earnings 07:00 ·
      # filings 07:05 · insider 07:13 · 13f 07:19 / 이 잡 07:34). 그래서 그 잡들이 만든 home_flow 는
      # 언제나 어제 자 assets 로 만들어졌고, 달력에서 가장 강조되는 칸(기준일)의 등락률만
      # 매일 비어 있었다 — 과거 칸엔 뜨는데 오늘 칸만 빈다. assets 를 새로 만든 **이 자리에서**
      # 다시 구워야 그 칸이 채워진다. ⚠ asof_index 보다 앞이어야 한다(as_of 를 읽어 간다).
      # 벤치마크 얇은 계열 — 내 포트폴리오 화면이 이것만 받는다(assets.json 은 5MB 다).
      # ⚠ assets.json 을 새로 만든 **이 자리에서** 같이 구워야 격자가 어긋나지 않는다.
      - name: Rebuild benchmark slim series
        run: python build/bench_px.py
      - name: Rebuild home flow (calendar day returns)
        run: python build/home_flow.py
      - name: Rebuild as-of index
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_gate.py check
      - name: Commit collected & display outputs
        run: |
          # 🚨 verdicts.json 을 더한다(2026-08-18 전수 감사). 이 잡이 129줄에서
          #   verdicts_gen.py 를 돌려 그 파일을 **쓰는데** 목록에 없었다.
          #   ⚠ 지금까지 안 터진 이유는 그 파일이 매번 바뀌지는 않아서다 —
          #     판정 원장이 실제로 바뀌는 날에만 ci_push 가드가 잡을 죽인다.
          #     «될 때는 되다가 정작 자료가 바뀌는 날 죽는» 형태라 더 나쁘다.
          bash build/ci_push.sh "chore(data): 자산 패널·시장판·스타일 성과 자동 갱신" \
            data/assets.json data/asset_strategies.json data/guru_clone.json \
            data/bench_px.json \
            data/strategy_index.json data/strategy_charts.json data/strategy_report.json \
            data/market_board.json data/home_perf.json data/style_perf.json data/style_trails.json data/style_pit.json data/pit_px.json \
            data/home_flow.json data/sector_panel.json data/asof.json \
            data/verdicts.json
      # 신선도는 커밋 직후에 본다 — 뒤가 죽어도 '패널이 낡았나'는 답이 나와야 한다.
      - name: Verify freshness
        run: python build/check_freshness.py data/assets.json "자산 패널" 10
      # 🚨 2026-08-12 추가. 위 한 줄만으로는 **하루를 잃어도 초록불**이었다 — 문턱이
      #   10영업일이라 08-11 을 통째로 건너뛴 것을 이 잡이 못 봤다. 패널에 10 을 준 데는
      #   이유가 있으므로(원천마다 지연이 다르다) 그 값은 두고, 홈 「기간별 수익률」이
      #   실제로 읽는 두 파일을 기본 문턱(2영업일)으로 따로 본다.
      # ⚠ 이 둘이 낡으면 홈 상단이 낡는다 — 여기서 빨갛게 만들어야 메일이 온다.
      - name: Verify freshness (home performance sources)
        run: |
          python build/check_freshness.py data/market_board.json "시장판"
          python build/check_freshness.py data/home_perf.json "홈 기간별 수익률"

      # ══ 2부(연구)는 여기 있었다 — 2026-08-03 refresh-ml.yml 로 뗐다 ═══════
      # 사유는 그쪽 머리말에 적었다. 요약하면 패널이 1.76배가 되면서(7f3402d) ML 이
      # 56분 안팎이 됐고, 60분 잡 타임아웃에 두 번 연속 잘렸다. 타임아웃만 올리면
      # 2~3분짜리 수집·표시가 계속 그 사고에 인질로 잡힌다.
      # refresh-ml 은 이 잡이 **성공한 뒤** workflow_run 으로 이어 달린다 — 크론을 새로
      # 잡지 않으므로 ML 이 어제 패널을 보는 일도 없다(쪼개지 않았던 원래 사유가 그것이다).
      # ⚠ 이 잡의 이름("Refresh asset panel & archive re-check")이 그쪽 트리거 키다.
      #   name: 을 바꾸면 refresh-ml 이 조용히 안 뜬다.
      #   → 2026-08-05 무효. refresh-ml.yml 은 삭제됐다(랩 자체를 지웠다). 이 잡을
      #     workflow_run 으로 물고 있는 워크플로는 이제 없으므로 name: 은 자유다.
