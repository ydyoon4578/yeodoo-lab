name: Refresh intraday bars (daily)

# 장중 분봉 수집(data/intraday.json · data/id/<티커>.json · data/intraday_hist.json).
#
# 🚨 왜 이 잡이 매일 돌아야 하나 — **야후가 과거를 안 준다.**
#   실측(2026-08-17, 야후 오류문구가 직접 말한다): 1분봉 7거래일 · 2분봉 23 · 5분봉 60.
#   그래서 오늘 안 받으면 그날 장중은 **영원히 못 잰다.** 이 잡이 며칠 쉬면 그만큼 이력에
#   구멍이 나고, 그 구멍은 나중에 어떤 방법으로도 못 메운다(다른 자료와 다른 점이다 —
#   일봉·재무는 언제 받아도 과거가 그대로 온다).
#   → data/intraday_hist.json 은 매일 «그날 요약» 을 붙인다. 60일 창을 넘어 쌓이는 유일한 길이다.
#
# 주기 — 미국장 마감 뒤. refresh-stocks(21:50 UTC) **뒤**에 둔다:
#   수집기가 유니버스를 data/stocks.json 에서 읽으므로 그 파일이 그날 것이어야 한다.
#   ⚠ 앞에 두면 어제 유니버스로 받게 되고, 편입·편출이 있던 날 그 종목이 조용히 빠진다.
#
# ⚠ data/id 는 그 세션 1분봉이고 **매일 덮어쓴다**(누적하지 않는다). 518종 약 3.7MB 다 —
#   같은 저장소가 이미 data/sd(54MB)를 매일 커밋하므로 비율로는 작다. 쌓으면 연 1GB 라
#   덮어쓰기로 둔 것이고, 대신 요약(intraday_hist.json)이 이력을 맡는다.

on:
  schedule:
    - cron: '35 22 * * 1-6'    # 매일(월~토) 07:35 KST — 미국장 마감·refresh-stocks 뒤
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-intraday
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        # 🚨 2026-08-19 — --prefer-binary. lxml 6.1.2 가 wheel 없이 올라와
        #   pip 이 소스 빌드로 넘어갔고 러너에 libxml2-dev 가 없어 죽었다
        #   (yfinance 의 전이 의존이라 우리가 부르지도 않는 패키지다).
        #   ⚠ 판을 손으로 박지 않는다 — 박은 수는 낡는다. wheel 이 있는 최신 판을
        #     고르게 두면 벤더가 wheel 을 올리는 대로 저절로 따라간다.
        run: pip install --prefer-binary --quiet pandas numpy yfinance
      # 🚨 기준선 — 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지 잰다.
      #   없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는 결함 때문에 방금 받은
      #   자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Fetch intraday bars
        run: python build/refresh_intraday.py
      # 장중 규칙 6종을 같이 다시 잰다 — 이력이 하루 늘었는데 표가 어제 것이면 한 화면이
      # 두 날을 말한다. 입력이 방금 구운 intraday_hist.json 하나뿐이라 네트워크가 없다.
      - name: Recompute intraday rules
        run: python build/intraday_backtest.py
      # 🚨 홈 「기간별 수익률」 차트의 1일 칸은 **분봉으로만** 만들 수 있다(일간 종가로는
      #   점이 둘이라 선이 안 된다). 그 칸을 굽는 build/home_perf.py 는 refresh-stocks
      #   (06:50 KST)에서도 돌지만 그때는 오늘 분봉이 아직 없다 — 여기서 다시 굽는다.
      #   ⚠ 같은 빌더다. 정의가 갈리지 않는다. 06:50~07:35 사이에는 1일 탭이 없는데,
      #     그건 빌더가 «분봉 세션 ≠ 일간 기준일» 이면 그 칸을 아예 안 만들기 때문이다
      #     (어제 것을 오늘이라 말하느니 탭이 잠깐 없는 편이 낫다).
      - name: Rebuild home period chart (adds 1D)
        run: python build/home_perf.py
      - name: Validate
        run: python build/validate_gate.py check
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 장중 분봉·장중 규칙 자동 갱신" \
            data/intraday.json data/intraday_hist.json data/intraday_strategies.json data/id             data/home_perf.json
      # '돌았는데 낡은 데이터'면 잡을 실패시킨다. as_of 는 **세션 날짜**(직전 거래일)이므로
      # 정상 실행이면 0~1영업일이다. 3이면 최소 하루를 통째로 걸렀다는 뜻이고, 그날 장중은
      # 영원히 못 받으므로 조용히 넘기면 안 된다.
      - name: Verify freshness
        run: python build/check_freshness.py data/intraday.json "장중 분봉" 3
