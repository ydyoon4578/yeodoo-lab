name: Refresh technical strategy lab

# 기술적 지표 기반 타이밍·횡단면 규칙을 한 번에 다시 돌린다(build/tech_backtest.py).
#
# 주기 — 주 1회. 입력이 일봉(data/stocks.json 계열)이라 하루 단위로는 판정이 사실상 안 바뀌고,
#   23개 규칙 × 518종목 × 753일을 매일 돌릴 이유가 없다. 대신 결과가 그대로면 커밋도 안 생긴다.
#
# 다중검정 — 게시 건수가 아니라 **돌린 전체 건수**로 본페로니 임계를 다시 계산한다.
#   규칙을 추가하면 임계가 자동으로 높아진다(스크립트 안에서 처리).

on:
  schedule:
    - cron: '45 0 * * 6'    # 매주 토 09:45 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tech
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run technical backtests
        run: python build/tech_backtest.py
      - name: Rebuild verdict ledger
        run: python build/verdicts_gen.py
      # 전 전략 통합 목록 — 원본(tech·asset·archive·deploy)이 바뀌면 같이 다시 굽는다.
      # 빠뜨리면 전략 랩만 옛 목록을 보여주고 아무도 알려주지 않는다.
      - name: Rebuild unified strategy index
        run: python build/strategy_index.py
      # 랩 상세 차트는 목록과 분리된 지연 로딩 파일이다 — 목록만 다시 굽고 이걸 빠뜨리면
      # 새 전략이 화면에서 '차트 없는 전략'으로 보인다.
      - name: Rebuild lab charts
        run: python build/strategy_charts.py
      - name: Rebuild as-of index
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_site.py
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 기술적 전략 백테스트 자동 갱신" \
            data/tech_strategies.json data/verdicts.json data/strategy_index.json data/strategy_charts.json data/asof.json
