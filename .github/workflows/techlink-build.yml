name: Build tech-link patent CPC table (B11, one-off)

# B11 기술 링크 모멘텀 — 특허 → 티커 × 등록월 × CPC subclass 집계.
# 사전등록 build/PREREG-2026-08-12-TECHLINK.md. 원천이 2024-12-31 동결이라 크론이 없다(수동 · 스크립트 변경 시).

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['build/techlink_build.py', '.github/workflows/techlink-build.yml']

permissions:
  contents: write

concurrency:
  group: techlink-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Disk before
        run: df -h /
      - name: Build CPC table
        run: python build/techlink_build.py
      - name: Commit output to this branch
        run: |
          # 브랜치 끝에 산출물만 얹는다(앞선 실행이 같은 파일을 커밋했어도 충돌 없이 덮는다).
          cp data/_techlink_cpc.json "$RUNNER_TEMP/out.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git checkout -q -B out FETCH_HEAD
            cp "$RUNNER_TEMP/out.json" data/_techlink_cpc.json
            git add data/_techlink_cpc.json
            git diff --cached --quiet && exit 0
            git commit -qm "chore(data): B11 기술 링크 특허 CPC 집계(1회성)"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
