name: Refresh release calendar (FRED)

# 국면 판정이 쓰는 FRED 39개 시리즈의 발표 일정을 수집한다.
#
# 주기 — 주 1회. 발표 예정일은 기관이 미리 공지하고 자주 바뀌지 않는다.
#   다만 창이 앞으로 120일이라, 주 1회면 끝이 계속 밀려 캘린더가 마르지 않는다.
#
# 소요 — 실측 약 1분(시리즈 39 + 릴리스 23 = 62콜, 0.55초 간격). FRED 상한은 분당 120회.

on:
  schedule:
    - cron: '16 22 * * 5'    # 매주 토 07:16 KST — 시장 국면 뒤(내용을 요구하는 하드 의존)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 설치 단계 없음 — urllib·json만 쓴다(fredapi를 쓰지 않는다)
      # 🚨 2026-08-05 — 기준선. 일을 시작하기 **전** 저장소가 이미 몇 건 깨져 있었는지
      #   잰다. 이게 없으면 아래 Validate 가 절대 기준이 되어, 이 잡과 상관없는
      #   결함 때문에 방금 받은 자료를 통째로 버린다(실제로 네 잡이 그랬다).
      - name: Validate baseline
        run: python build/validate_gate.py baseline
      - name: Collect release calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build/refresh_calendar.py
      - name: Rebuild as-of index
        run: python build/asof_index.py
      - name: Validate
        run: python build/validate_gate.py check
      - name: Commit if changed
        run: |
          bash build/ci_push.sh "chore(data): 경제지표 발표 일정 자동 갱신" \
            data/calendar.json data/asof.json
      # as_of는 '수집한 날'이다(다른 축과 달리 발표일이 아니다) — 주 1회 도니 10영업일이면 넉넉하다
      - name: Verify freshness
        run: python build/check_freshness.py data/calendar.json "발표 일정" 10
