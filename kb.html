<!-- SHELLFONT:BEGIN --><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><!-- SHELLFONT:END -->
<style>
  :root{
    --ground:#F4F1EA;--panel:#FFFFFF;--panel-2:#F8F6F1;--line:#E2DDD1;--line-soft:#EDE9E0;
    --ink:#2A2621;--ink-2:#4B453B;--muted:#786F61;--accent:#8A6B00;--accent-2:#5E4900;
    --deploy:#0E8A54;--marg:#B25E12;--champ:#2C6E8F;--rp:#7A5AA6;--hot:#A64B3B;
    --shadow:0 1px 2px rgba(42,38,33,.05),0 10px 30px -14px rgba(42,38,33,.2);
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#15130F;--panel:#201D18;--panel-2:#2A2620;--line:#3A342B;--line-soft:#2F2A23;
    --ink:#F1EDE4;--ink-2:#D0C9BB;--muted:#968C7C;--accent:#FFBC00;--accent-2:#FFD766;
    --deploy:#38D083;--marg:#F0863C;--champ:#6BB0D6;--rp:#B79AE0;--hot:#E5806A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.65);
  }}
  :root[data-theme="light"]{--ground:#F4F1EA;--panel:#FFFFFF;--panel-2:#F8F6F1;--line:#E2DDD1;--line-soft:#EDE9E0;--ink:#2A2621;--ink-2:#4B453B;--muted:#786F61;--accent:#8A6B00;--accent-2:#5E4900;--deploy:#0E8A54;--marg:#B25E12;--champ:#2C6E8F;--rp:#7A5AA6;--hot:#A64B3B;--shadow:0 1px 2px rgba(42,38,33,.05),0 10px 30px -14px rgba(42,38,33,.2);}
  :root[data-theme="dark"]{--ground:#15130F;--panel:#201D18;--panel-2:#2A2620;--line:#3A342B;--line-soft:#2F2A23;--ink:#F1EDE4;--ink-2:#D0C9BB;--muted:#968C7C;--accent:#FFBC00;--accent-2:#FFD766;--deploy:#38D083;--marg:#F0863C;--champ:#6BB0D6;--rp:#B79AE0;--hot:#E5806A;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.65);}
  :root{--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Malgun Gothic",monospace;--sans:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  .wrap{max-width:1200px;margin:0 auto;padding:0 22px 80px}
  header.mast{padding:40px 0 20px;border-bottom:1px solid var(--line)}
  .utilbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .themebtn{width:30px;height:30px;border-radius:2px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .themebtn:hover{border-color:var(--accent)}
  h1.title{font-family:var(--mono);font-weight:600;font-size:clamp(24px,4.4vw,36px);line-height:1.15;letter-spacing:-.015em;margin:0}
  h1.title span.gx{background:linear-gradient(92deg,var(--accent),var(--champ) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .back{font-size:13px;color:var(--muted);text-decoration:none;font-family:var(--mono)}
  .back:hover{color:var(--accent)}

  /* ── 잠금 화면 ── */
  .gate{max-width:520px;margin:80px auto;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:34px 32px;box-shadow:var(--shadow)}
  .gate h2{margin:0 0 6px;font-size:19px;font-family:var(--mono)}
  .gate p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .gate label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:7px;font-weight:600}
  .gate input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:2px;background:var(--panel-2);color:var(--ink);font-size:15px;font-family:var(--mono)}
  .gate input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .gate button{margin-top:14px;width:100%;padding:11px;border:none;border-radius:2px;background:var(--accent);color:var(--ground);font-weight:700;font-size:15px;cursor:pointer;font-family:var(--sans)}
  .gate button:hover{background:var(--accent-2)}
  .gate button:disabled{opacity:.55;cursor:default}
  .gerr{margin-top:12px;color:var(--hot);font-size:13.5px;min-height:20px}
  .ghint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted);line-height:1.6}

  /* ── 탭 ── */
  .tabbar{display:flex;gap:8px;margin:26px 0 8px;flex-wrap:wrap}
  .tb{padding:9px 20px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:14px;font-weight:600}
  .tb:hover{border-color:var(--accent)}
  .tb[aria-selected="true"]{background:var(--accent);color:var(--ground);border-color:var(--accent)}

  /* ── 본문 ── */
  .tabpane{padding-top:14px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:16px 0 4px}
  h2{font-size:clamp(21px,3.4vw,28px);margin:0 0 14px;letter-spacing:-.01em;line-height:1.3}
  h3{font-size:17.5px;margin:36px 0 10px;letter-spacing:-.01em;padding-top:16px;border-top:1px solid var(--line-soft)}
  h3.star{border-top:2px solid var(--accent);color:var(--accent)}
  p{margin:11px 0}
  ul{margin:11px 0;padding-left:20px}li{margin:6px 0}
  code{background:var(--panel-2);padding:1.5px 5px;border-radius:2px;font-family:var(--mono);font-size:.87em}
  .dim{color:var(--muted);font-weight:400}
  .lead{font-size:17px;line-height:1.72;background:var(--panel);border-left:3px solid var(--accent);padding:16px 20px;border-radius:0 2px 2px 0;margin:18px 0}
  .note{background:var(--panel-2);border-left:3px solid var(--muted);padding:12px 16px;border-radius:0 2px 2px 0;font-size:14.5px;margin:16px 0}
  .warn{background:var(--panel);border-left:3px solid var(--marg);padding:13px 17px;border-radius:0 2px 2px 0;font-size:14.5px;margin:16px 0;box-shadow:var(--shadow)}

  .tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:2px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
  thead th{background:var(--panel-2);font-weight:700;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:none}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
  tr.tot td{font-weight:700;background:var(--panel-2)}
  tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .pos{color:var(--deploy);font-weight:600}.neg{color:var(--hot);font-weight:600}
  .b{font-weight:700;color:var(--accent)}
  .warn2{color:var(--marg);font-weight:600}
  b.sev{color:var(--hot)}
  ul.flaws li{margin:9px 0}

  .funnel{margin:18px 0}
  .funnel .fs{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:12px 18px;box-shadow:var(--shadow)}
  .funnel .fs b{display:block;font-family:var(--mono);font-size:15px}
  .funnel .fs span{font-size:13px;color:var(--muted)}
  .funnel .fa{text-align:center;color:var(--accent);font-size:15px;padding:5px 0}

  .finding{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
  .fitem{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:2px;padding:16px 20px;box-shadow:var(--shadow)}
  .fitem .fh{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--accent);margin:0 0 8px}
  .fitem p{font-size:14.5px;margin:0}
  @media(max-width:720px){.finding{grid-template-columns:1fr}}

  .verdict{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:8px 24px 20px;margin:18px 0;box-shadow:var(--shadow)}
  .vh{font-family:var(--mono);font-size:14px;font-weight:700;margin:20px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)}
  .vpos{color:var(--deploy)}.vneg{color:var(--hot)}.vwarn{color:var(--marg)}
  .verdict ul{margin:8px 0 0}.verdict li{font-size:14.5px}

  footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  footer a{color:var(--accent)}
  @media(max-width:640px){body{font-size:15px}.wrap{padding:0 14px 50px}}
  @media print{.gate,.tabbar,.themebtn{display:none!important}.tabpane{display:block!important}
    body{background:#fff;color:#000}.tw,table,.fitem,.verdict{page-break-inside:avoid}}

/* SHELL:BEGIN */
/* ── 공통 셸 v1 — build/sync_shell.py 생성. 이 블록은 직접 고치지 말 것 ──────────────
   23장이 각자 스타일 블록을 들고 있어 공통 양식을 넣을 자리가 첫 블록 맨 끝밖에 없다.
   같은 특이도면 뒤가 이기므로 페이지 셸 규칙만 덮어쓰고 고유 컴포넌트는 건드리지 않는다.
   ⚠ 이 블록 안에 스타일 종료 태그를 글자 그대로 쓰면 안 된다 — HTML 파서는 주석 안이든
      아니든 그 지점에서 style 요소를 끝내버린다(실제로 한 번 밟았다). */

/* ① 글꼴 — Pretendard.
   기존 스택 첫 후보는 "Malgun Gothic"이었다. 윈도 기본 한글 글꼴이라 굵기가 사실상 400/700
   두 단계뿐이고 맥에서는 Apple SD Gothic Neo로 떨어져, 같은 화면이 OS마다 다른 글꼴로 보였다.
   Pretendard는 100~900 가변에 라틴·숫자가 Inter 계열이라 한글과 숫자가 한 글꼴로 붙는다.
   --mono의 한글 후보도 Pretendard로 바꾼다 — 고정폭이 필요한 건 숫자뿐인데, 한글까지 고정폭
   스택으로 떨어뜨리면 본문과 다른 글꼴이 한 줄 안에서 섞인다. */
:root{
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",monospace;
  /* 폭 토큰 — 페이지를 옮겨 다닐 때 본문 폭이 튀지 않게 하는 값이다. 21장은 각자 갖고 있었지만
     stocks.html은 max-width:var(--w-wide)를 쓰면서 정의를 안 갖고 있어 폭 제한 없이 퍼져 있었다.
     이런 건 페이지마다 챙길 것이 아니라 셸이 보장할 것이다.
     🚨 2026-08-10 — --w-wide 를 1440 → 1680 으로 올렸다(사용자 요청 '화면을 최대한 넓게').
       홈은 자료 화면이다. 종목 히트맵이 518칸을 그리는데 폭이 곧 읽히는 종목 수다 —
       1200px 에서는 가장 작은 칸이 7×10px 라 글자가 안 들어갔다.
       ⚠ 내비(.topnav .nvin)도 이 토큰을 쓴다. 본문만 넓히면 내비보다 본문이 넓어져
         화면이 어긋나 보인다 — 그래서 페이지가 아니라 여기서 바꾼다.
       ⚠ --w-read 는 글이 주인 화면이다. 한 줄이 길어지면 읽기 나빠지므로 가장 덜 늘린다 —
         넓게 쓰는 것과 아무 데나 늘리는 것은 다르다.
     🚨 2026-08-19 — **고정 px 를 걷고 화면에 맞춘다**(사용자 지적 "사이트 전체에서 빈공간이
       절반이야, 내 화면 기준"). 종전에는 상한이 1680/1200/980 고정이라 2560px 화면에서
       본문이 각각 66%/47%/38% 만 썼다. 남는 절반은 배경이었다.
       → min(뷰포트 비율, 상한) 으로 바꾼다. 좁은 화면에서는 vw 가 이겨 종전과 같고,
         넓은 화면에서만 상한까지 늘어난다. 세 층 구조는 그대로 둔다 —
         층을 없애면 «글 화면» 이 표 화면만큼 넓어져 읽기가 나빠진다.
       ⚠ 상한을 무한히 두지 않는 이유: 표·차트는 넓을수록 낫지만 글줄은 아니고,
         내비(.topnav .nvin)도 같은 토큰을 쓰기 때문에 통째로 늘어난다. */
  --w-wide:min(96vw,2240px);--w-base:min(94vw,1600px);--w-read:min(92vw,1120px);
}
/* 넓은 층 한 벌 — 종전에는 intraday·rates 가 **각자** 이 한 줄을 갖고 있었다.
   그래서 다른 페이지를 넓은 층으로 올리려면 CSS 를 또 복사해야 했고, 실제로 guru 를
   올렸더니 class 만 붙고 아무 일도 안 일어났다(2026-08-19 실측). 셸이 보장한다.
   ⚠ 대체값(fallback)을 두지 않는다 — 토큰은 바로 위에서 셸이 반드시 정의한다. */
.wrap.wide{max-width:var(--w-wide)}

/* ② 중립색 — 라이트는 중립 회색, 다크는 터미널 계열. 의미색(accent·deploy·국면·심리 계열)은
   손대지 않는다. 대비는 sync_shell.py의 check_contrast()가 배포 전에 검사한다.
   ⚠ 주석에 별표와 빗금이 붙은 토큰명을 그대로 쓰면 거기서 주석이 닫힌다(밟았다). */
:root{--ground:#FBFAF7;--panel:#FBFAF7;--panel-2:#F2F0EB;--line:#D8D6D0;--line-soft:#EDEBE6;--ink:#111418;--ink-2:#3E444B;--muted:#5F656D;--shadow:none;--hot:#A3352A;--marg:#7E5200;--deploy:#0A7040;--accent:#0A5697;}
@media(prefers-color-scheme:dark){:root{--ground:#0C0E11;--panel:#0C0E11;--panel-2:#161A1F;--line:#252A30;--line-soft:#1A1E23;--ink:#DEE3E8;--ink-2:#AEB6BE;--muted:#949DA6;--shadow:none;--hot:#E8887A;--marg:#DFAE55;--deploy:#4BD08D;--accent:#6FB6EA;}}
:root[data-theme="light"]{--ground:#FBFAF7;--panel:#FBFAF7;--panel-2:#F2F0EB;--line:#D8D6D0;--line-soft:#EDEBE6;--ink:#111418;--ink-2:#3E444B;--muted:#5F656D;--shadow:none;--hot:#A3352A;--marg:#7E5200;--deploy:#0A7040;--accent:#0A5697;}
:root[data-theme="dark"]{--ground:#0C0E11;--panel:#0C0E11;--panel-2:#161A1F;--line:#252A30;--line-soft:#1A1E23;--ink:#DEE3E8;--ink-2:#AEB6BE;--muted:#949DA6;--shadow:none;--hot:#E8887A;--marg:#DFAE55;--deploy:#4BD08D;--accent:#6FB6EA;}

/* ③ 타이포 — 한글에 고정폭·대문자변환·자간을 걸던 것을 되돌린다.
   한글은 대소문자가 없어 text-transform:uppercase가 무의미하고(라틴만 바뀐다), 자간 .1~.2em은
   음절을 벌려 읽기를 방해한다. 실제로 이 규칙 때문에 통계량 |t|가 화면에서 |T|로 찍힌 적이 있다. */
body{font-family:var(--sans);letter-spacing:-.003em}
h1,h2,h3,h4{letter-spacing:-.02em}
h1.title{font-family:var(--sans);font-weight:800;letter-spacing:-.032em;line-height:1.14}
/* 큰 제목은 본문 글꼴로. 고정폭 스택에서 한글은 Pretendard로, 라틴·숫자는 SF Mono로 떨어져
   한 제목 안에 두 글꼴이 섞인다("… RP 통합 (Multi-Sleeve Core)"가 그렇게 보였다).
   작은 머리글(h4 등)은 라틴 약어가 대부분이라 그대로 둔다.
   :not(._)은 특이도를 페이지 규칙(.dtop h2 같은 것)과 맞추려고 붙였다 — 요소 선택자만으로는
   페이지 쪽이 이긴다. !important를 쓰지 않으려는 최소 장치다. */
:is(h1,h2):not(._){font-family:var(--sans);letter-spacing:-.025em}
.eyebrow{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.06em}
.lbl{font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:-.012em;text-transform:none;color:var(--ink)}
.lbl::before{height:16px}
.lbl .sub{font-size:12.5px;font-weight:500}
.card .ch{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none}
.chip{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:-.006em;border-radius:2px}

/* ④ 숫자 — 자릿수가 흔들리면 세로로 비교할 수 없다. 표·지표값은 전부 고정폭 숫자로. */
.tnum,.num,.cv,.stat,table,code,kbd{font-variant-numeric:tabular-nums}

/* ⑤ 표 — 머리글은 한글이라 고정폭을 벗기고, 행에 hover를 준다(어느 줄을 읽는지 잃지 않게). */
.tbl{font-variant-numeric:tabular-nums}
.tbl thead th{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.tbl tbody th{font-family:var(--sans);font-weight:700;letter-spacing:-.01em}
.tbl tbody tr:hover>*{background:color-mix(in srgb,var(--accent) 7%,transparent)}

/* ⑥ 잔손질 — 키보드 초점 링(전엔 브라우저 기본에 맡겨 다크에서 안 보였다), 선택색, 얇은 스크롤바 */
:where(a,button,summary,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* ⑦ 장식 걷기 (2026-08-09) — 사용자 지적 "클로드 특유의 인터페이스 구성방식".
   그 인상의 정체는 색만이 아니다. **떠 있는 둥근 카드**와 **알약 배지**가 나머지 몫이다.
   팔레트는 위에서 바꿨고 여기서 형태를 걷는다.

   🚨 범위를 좁게 잡는다. 페이지마다 컴포넌트가 다르고, 전부에 border-radius:0 을 걸면
     입력창·버튼까지 각져 오히려 쓰기 나빠진다. **떠 보이게 하는 것**만 끈다:
       · box-shadow — 토큰(--shadow:none)으로 이미 죽지만, 값을 손으로 박은 자리가 남아 있다
       · 큰 모서리(2px 이상) — 카드가 카드처럼 보이는 반경. 작은 반경(칩·입력)은 둔다
   ⚠ :where() 로 감싸 특이도 0 으로 둔다 — 페이지가 의도적으로 다르게 준 곳은 그대로 이긴다.
     셸이 페이지를 이겨서는 안 된다(이 블록의 원칙이다). */
:where(.card,.scard,.rep,.panel,.box,.tile,.sec,details,.toc,table,.tbl,.search,.controls,
       .asoftbl,.asofrow,.calgrid,.calcell,.chiprow,.statline){box-shadow:none}
:where(.card,.scard,.rep,.panel,.box,.tile,.asoftbl,.calgrid,details.toc){border-radius:3px}
/* SHELL:END */

  var gate=document.getElementById('gate'), pw=document.getElementById('pw'),
      go=document.getElementById('go'), err=document.getElementById('err'),
      content=document.getElementById('content'), ft=document.getElementById('ft');

  function b642buf(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}

  function bindTabs(){
    var tabs=content.querySelectorAll('.tb'), panes=content.querySelectorAll('.tabpane');
    function show(id){
      tabs.forEach(function(t){t.setAttribute('aria-selected', t.dataset.tab===id?'true':'false');});
      panes.forEach(function(p){p.hidden = (p.id!=='pane-'+id);});
      try{history.replaceState(null,'','#'+id);}catch(e){}
    }
    tabs.forEach(function(t){t.addEventListener('click',function(){show(t.dataset.tab);});});
    var h=(location.hash||'').replace('#',''); show(['k','b','cmp','x','imp'].indexOf(h)>=0?h:'k');
  }

  async function unlock(){
    var p=pw.value; if(!p){err.textContent='암호를 입력하세요.';return;}

    try{
      var enc=new TextEncoder();
      var km=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);

      err.textContent=''; pw.value='';
      gate.hidden=true; content.hidden=false; ft.hidden=false;
      bindTabs();
    }catch(e){
      err.textContent='암호가 올바르지 않습니다.'; go.disabled=false; pw.select();

  }
  go.addEventListener('click',unlock);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
  if(!(crypto&&crypto.subtle)){err.textContent='이 브라우저는 WebCrypto를 지원하지 않습니다 (HTTPS 필요).';go.disabled=true;}
