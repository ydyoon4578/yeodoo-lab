<!-- SHELLFONT:BEGIN --><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><!-- SHELLFONT:END -->
<style>
  :root{
    --ground:#F5F7FA;--panel:#FFFFFF;--panel-2:#EEF2F6;--line:#DCE3EA;--line-soft:#E9EEF3;
    --ink:#1B2733;--ink-2:#42505E;--muted:#646B74;--accent:#816400;
    --deploy:#0C7A4A;--marg:#A35510;--champ:#2C6E8F;--rp:#7A5AA6;--hot:#A64B3B;
    --shadow:0 1px 2px rgba(23,39,51,.05),0 10px 30px -16px rgba(23,39,51,.18);
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0F141A;--panel:#181E26;--panel-2:#20272F;--line:#2E3742;--line-soft:#242C34;
    --ink:#EAEEF2;--ink-2:#C4CDD6;--muted:#8A97A3;--accent:#FFBC00;
    --deploy:#38D083;--marg:#F0863C;--champ:#6BB0D6;--rp:#B79AE0;--hot:#E5806A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.6);
  }}
  :root[data-theme="light"]{--ground:#F5F7FA;--panel:#FFFFFF;--panel-2:#EEF2F6;--line:#DCE3EA;--line-soft:#E9EEF3;--ink:#1B2733;--ink-2:#42505E;--muted:#646B74;--accent:#816400;--deploy:#0C7A4A;--marg:#A35510;--champ:#2C6E8F;--rp:#7A5AA6;--hot:#A64B3B;--shadow:0 1px 2px rgba(23,39,51,.05),0 10px 30px -16px rgba(23,39,51,.18);}
  :root[data-theme="dark"]{--ground:#0F141A;--panel:#181E26;--panel-2:#20272F;--line:#2E3742;--line-soft:#242C34;--ink:#EAEEF2;--ink-2:#C4CDD6;--muted:#8A97A3;--accent:#FFBC00;--deploy:#38D083;--marg:#F0863C;--champ:#6BB0D6;--rp:#B79AE0;--hot:#E5806A;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.6);}
  /* 폭 토큰은 셸이 보장한다(build/sync_shell.py) — 페이지 사본은 2026-08-10 에 걷어냈다.
     사본이 1440 으로 남아 있었는데 셸은 1680 이었다. 지금은 셸이 뒤에 와서 셸이 이기지만,
     CSS 순서가 바뀌면 조용히 뒤집힌다. 같은 값을 두 곳에 두지 않는다. */
  :root{--mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",monospace;--sans:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  a{color:inherit}
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:var(--w-base);margin:0 auto;padding:0 22px 80px}
  @media(max-width:640px){.wrap{padding:0 14px 60px}}

  header.mast{padding:40px 0 22px;border-bottom:1px solid var(--line)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:12px}
  .eyebrow::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}
  h1.title{font-family:var(--mono);font-weight:600;font-size:clamp(25px,4.4vw,36px);line-height:1.1;letter-spacing:-.02em;margin:14px 0 0;text-wrap:balance}
  .lede{margin:14px 0 0;max-width:74ch;font-size:15px;color:var(--ink-2)}
  .lede b{color:var(--ink)}

  .tally{margin:22px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px}
  .ty{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--edge,var(--line));border-radius:2px;padding:13px 15px;box-shadow:var(--shadow)}
  .ty b{display:block;font-family:var(--mono);font-size:26px;font-weight:800;color:var(--edge,var(--ink));line-height:1}
  .ty span{display:block;margin-top:5px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .ty em{display:block;margin-top:6px;font-style:normal;font-size:11.5px;color:var(--ink-2);line-height:1.5}

  .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:700;margin:40px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lbl::before{content:"";width:3px;height:14px;background:var(--accent);border-radius:2px;flex:none}
  .lblnote{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.65}

  .note{background:var(--panel-2);border:1px solid var(--line-soft);border-left:3px solid var(--marg);border-radius:2px;padding:12px 16px;margin:16px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.7}
  /* details.more — 이 파일이 class="more" 를 쓰는데 규칙이 없어 요약 화살표·여백이 안 붙었다.
     index.html 482~489 행의 정본을 그대로 옮긴다(2026-08-03). */
  details.more{margin-top:7px}
  details.more>summary{cursor:pointer;color:var(--ink-2);list-style:none;display:inline-flex;align-items:center;gap:5px}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:'\25B8';font-size:11px}
  details.more[open]>summary::before{content:'\25BE'}
  details.more>summary:hover{color:var(--accent)}
  details.more .mbody{margin-top:7px}
  details.more .mbody p{margin:0 0 6px} details.more .mbody p:last-child{margin-bottom:0}
  .note b{color:var(--ink)}
  .note.hard{border-left-color:var(--hot)}
  .skel{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding:20px 0}

  /* ── 필터 ── */
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 16px}
  .frow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .frow+.frow{margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)}
  .frow>.fl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;flex:none;width:64px}
  input[type=search]{font-family:var(--mono);font-size:12.5px;padding:7px 11px;border:1px solid var(--line);border-radius:2px;background:var(--ground);color:var(--ink);min-width:190px}
  input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
  .chip{font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;border:1px solid var(--line);border-radius:2px;background:var(--ground);color:var(--ink-2);cursor:pointer;line-height:1.4}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  /* 선택 칩은 accent 배경 위에 글자를 올린다. 다크에서 --panel은 밝지 않아 대비가 죽으므로
     양쪽 테마 모두에서 어두운 글자로 고정한다(accent가 라이트=황토, 다크=노랑이라 둘 다 밝은 편). */
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
  @media (prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#131820}}
  :root[data-theme="light"] .chip[aria-pressed=true]{color:#FFFFFF}
  :root[data-theme="dark"] .chip[aria-pressed=true]{color:#131820}
  .chip .cn{font-weight:500;opacity:.75;margin-left:4px}

  /* ── 피드 ── */
  .feed{display:flex;flex-direction:column;gap:1px}
  .fil{display:grid;grid-template-columns:96px 92px 1fr auto;gap:3px 13px;align-items:baseline;padding:11px 2px;border-top:1px solid var(--line-soft)}
  .fil:first-child{border-top:0}
  .fil .fd{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .fil .ft{font-family:var(--mono);font-size:13px;font-weight:800;letter-spacing:-.01em}
  .fil .ft a{text-decoration:none} .fil .ft a:hover{color:var(--accent)}
  .fil .fi{display:flex;gap:6px;flex-wrap:wrap}
  .fil .fo{font-family:var(--mono);font-size:11px;white-space:nowrap}
  .fil .fo a{color:var(--accent);text-decoration:none} .fil .fo a:hover{text-decoration:underline}
  .fil .fn{grid-column:2/-1;font-size:11.5px;color:var(--muted);line-height:1.5}
  .it{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:2px;background:var(--panel-2);border:1px solid var(--line-soft);color:var(--ink-2);white-space:nowrap}
  .it.maj{border-color:var(--hot);color:var(--hot);background:transparent}
  .it .ic{opacity:.65;font-weight:500;margin-right:5px}
  @media(max-width:720px){
    .fil{grid-template-columns:1fr auto}
    .fil .fd{grid-column:1} .fil .ft{grid-column:1} .fil .fi{grid-column:1/-1} .fil .fn{grid-column:1/-1}
  }

  .more{display:block;width:100%;margin:16px 0 0;padding:11px;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:2px;color:var(--ink-2);cursor:pointer}
  .more:hover{border-color:var(--accent);color:var(--ink)}

  .leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:1px 18px}
  .leg div{font-size:12px;padding:5px 0;border-top:1px solid var(--line-soft);color:var(--ink-2)}
  .leg code{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:700;margin-right:7px}
  .leg .mj code{color:var(--hot)}

  footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11.5px;line-height:1.8}
  footer a{color:var(--accent);text-decoration:none} footer a:hover{text-decoration:underline}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}

/* SHELL:BEGIN */
/* ── 공통 셸 v1 — build/sync_shell.py 생성. 이 블록은 직접 고치지 말 것 ──────────────
   23장이 각자 스타일 블록을 들고 있어 공통 양식을 넣을 자리가 첫 블록 맨 끝밖에 없다.
   같은 특이도면 뒤가 이기므로 페이지 셸 규칙만 덮어쓰고 고유 컴포넌트는 건드리지 않는다.
   ⚠ 이 블록 안에 스타일 종료 태그를 글자 그대로 쓰면 안 된다 — HTML 파서는 주석 안이든
      아니든 그 지점에서 style 요소를 끝내버린다(실제로 한 번 밟았다). */

/* ① 글꼴 — Pretendard.
   기존 스택 첫 후보는 "Malgun Gothic"이었다. 윈도 기본 한글 글꼴이라 굵기가 사실상 400/700
   두 단계뿐이고 맥에서는 Apple SD Gothic Neo로 떨어져, 같은 화면이 OS마다 다른 글꼴로 보였다.
   Pretendard는 100~900 가변에 라틴·숫자가 Inter 계열이라 한글과 숫자가 한 글꼴로 붙는다.
   --mono의 한글 후보도 Pretendard로 바꾼다 — 고정폭이 필요한 건 숫자뿐인데, 한글까지 고정폭
   스택으로 떨어뜨리면 본문과 다른 글꼴이 한 줄 안에서 섞인다. */
:root{
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",monospace;
  /* 폭 토큰 — 페이지를 옮겨 다닐 때 본문 폭이 튀지 않게 하는 값이다. 21장은 각자 갖고 있었지만
     stocks.html은 max-width:var(--w-wide)를 쓰면서 정의를 안 갖고 있어 폭 제한 없이 퍼져 있었다.
     이런 건 페이지마다 챙길 것이 아니라 셸이 보장할 것이다.
     🚨 2026-08-10 — --w-wide 를 1440 → 1680 으로 올렸다(사용자 요청 '화면을 최대한 넓게').
       홈은 자료 화면이다. 종목 히트맵이 518칸을 그리는데 폭이 곧 읽히는 종목 수다 —
       1200px 에서는 가장 작은 칸이 7×10px 라 글자가 안 들어갔다.
       ⚠ 내비(.topnav .nvin)도 이 토큰을 쓴다. 본문만 넓히면 내비보다 본문이 넓어져
         화면이 어긋나 보인다 — 그래서 페이지가 아니라 여기서 바꾼다.
       ⚠ --w-read(980)는 그대로다. 글이 주인 화면은 한 줄이 길어지면 읽기 나빠진다 —
         넓게 쓰는 것과 아무 데나 늘리는 것은 다르다. */
  --w-wide:1680px;--w-base:1200px;--w-read:980px;
}

/* ② 중립색 — 라이트는 중립 회색, 다크는 터미널 계열. 의미색(accent·deploy·국면·심리 계열)은
   손대지 않는다. 대비는 sync_shell.py의 check_contrast()가 배포 전에 검사한다.
   ⚠ 주석에 별표와 빗금이 붙은 토큰명을 그대로 쓰면 거기서 주석이 닫힌다(밟았다). */
:root{--ground:#FBFAF7;--panel:#FBFAF7;--panel-2:#F2F0EB;--line:#D8D6D0;--line-soft:#EDEBE6;--ink:#111418;--ink-2:#3E444B;--muted:#5F656D;--shadow:none;--hot:#A3352A;--marg:#7E5200;--deploy:#0A7040;--accent:#0A5697;}
@media(prefers-color-scheme:dark){:root{--ground:#0C0E11;--panel:#0C0E11;--panel-2:#161A1F;--line:#252A30;--line-soft:#1A1E23;--ink:#DEE3E8;--ink-2:#AEB6BE;--muted:#949DA6;--shadow:none;--hot:#E8887A;--marg:#DFAE55;--deploy:#4BD08D;--accent:#6FB6EA;}}
:root[data-theme="light"]{--ground:#FBFAF7;--panel:#FBFAF7;--panel-2:#F2F0EB;--line:#D8D6D0;--line-soft:#EDEBE6;--ink:#111418;--ink-2:#3E444B;--muted:#5F656D;--shadow:none;--hot:#A3352A;--marg:#7E5200;--deploy:#0A7040;--accent:#0A5697;}
:root[data-theme="dark"]{--ground:#0C0E11;--panel:#0C0E11;--panel-2:#161A1F;--line:#252A30;--line-soft:#1A1E23;--ink:#DEE3E8;--ink-2:#AEB6BE;--muted:#949DA6;--shadow:none;--hot:#E8887A;--marg:#DFAE55;--deploy:#4BD08D;--accent:#6FB6EA;}

/* ③ 타이포 — 한글에 고정폭·대문자변환·자간을 걸던 것을 되돌린다.
   한글은 대소문자가 없어 text-transform:uppercase가 무의미하고(라틴만 바뀐다), 자간 .1~.2em은
   음절을 벌려 읽기를 방해한다. 실제로 이 규칙 때문에 통계량 |t|가 화면에서 |T|로 찍힌 적이 있다. */
body{font-family:var(--sans);letter-spacing:-.003em}
h1,h2,h3,h4{letter-spacing:-.02em}
h1.title{font-family:var(--sans);font-weight:800;letter-spacing:-.032em;line-height:1.14}
/* 큰 제목은 본문 글꼴로. 고정폭 스택에서 한글은 Pretendard로, 라틴·숫자는 SF Mono로 떨어져
   한 제목 안에 두 글꼴이 섞인다("… RP 통합 (Multi-Sleeve Core)"가 그렇게 보였다).
   작은 머리글(h4 등)은 라틴 약어가 대부분이라 그대로 둔다.
   :not(._)은 특이도를 페이지 규칙(.dtop h2 같은 것)과 맞추려고 붙였다 — 요소 선택자만으로는
   페이지 쪽이 이긴다. !important를 쓰지 않으려는 최소 장치다. */
:is(h1,h2):not(._){font-family:var(--sans);letter-spacing:-.025em}
.eyebrow{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.06em}
.lbl{font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:-.012em;text-transform:none;color:var(--ink)}
.lbl::before{height:16px}
.lbl .sub{font-size:12.5px;font-weight:500}
.card .ch{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none}
.chip{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:-.006em;border-radius:2px}

/* ④ 숫자 — 자릿수가 흔들리면 세로로 비교할 수 없다. 표·지표값은 전부 고정폭 숫자로. */
.tnum,.num,.cv,.stat,table,code,kbd{font-variant-numeric:tabular-nums}

/* ⑤ 표 — 머리글은 한글이라 고정폭을 벗기고, 행에 hover를 준다(어느 줄을 읽는지 잃지 않게). */
.tbl{font-variant-numeric:tabular-nums}
.tbl thead th{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.tbl tbody th{font-family:var(--sans);font-weight:700;letter-spacing:-.01em}
.tbl tbody tr:hover>*{background:color-mix(in srgb,var(--accent) 7%,transparent)}

::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* ⑦ 장식 걷기 (2026-08-09) — 사용자 지적 "클로드 특유의 인터페이스 구성방식".
   그 인상의 정체는 색만이 아니다. **떠 있는 둥근 카드**와 **알약 배지**가 나머지 몫이다.
   팔레트는 위에서 바꿨고 여기서 형태를 걷는다.

   🚨 범위를 좁게 잡는다. 페이지마다 컴포넌트가 다르고, 전부에 border-radius:0 을 걸면
     입력창·버튼까지 각져 오히려 쓰기 나빠진다. **떠 보이게 하는 것**만 끈다:
       · box-shadow — 토큰(--shadow:none)으로 이미 죽지만, 값을 손으로 박은 자리가 남아 있다
       · 큰 모서리(2px 이상) — 카드가 카드처럼 보이는 반경. 작은 반경(칩·입력)은 둔다
   ⚠ :where() 로 감싸 특이도 0 으로 둔다 — 페이지가 의도적으로 다르게 준 곳은 그대로 이긴다.
     셸이 페이지를 이겨서는 안 된다(이 블록의 원칙이다). */

       .asoftbl,.asofrow,.calgrid,.calcell,.chiprow,.statline){box-shadow:none}
:where(.card,.scard,.rep,.panel,.box,.tile,.asoftbl,.calgrid,details.toc){border-radius:3px}

<script>
(function(){
  var root=document.documentElement;
  // ── 테마 ── (초기 적용은 <head> 인라인 스크립트가 이미 했다 — 여기서 다시 하면 이중 실행)
  var tb=document.getElementById('themebtn');
  if(tb)tb.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark'; root.setAttribute('data-theme',next);
    try{localStorage.setItem('yeouido-theme',next);}catch(e){}
  });

  // ── 현재 위치: 마크업이 아니라 <body data-tool>에서 읽는다(메뉴 블록을 전 페이지 동일하게 유지) ──
  var cur=(document.body.getAttribute('data-tool')||'').trim();
  if(cur){
    var a=document.querySelector('.mmi[data-nav="'+cur.replace(/"/g,'')+'"]');
    if(a){a.setAttribute('aria-current','page');
      var li=a.closest('.navcat'); if(li)li.classList.add('on');}
  }

  // ── 카테고리 패널 ──
  var cats=[].slice.call(document.querySelectorAll('.navcat'));
  var drawer=document.getElementById('navcats'), toggle=document.getElementById('navtoggle');
  function mobile(){return matchMedia('(max-width:1100px)').matches;}
  function closeAll(except){
    cats.forEach(function(li){
      var b=li.querySelector('button'), p=li.querySelector('.mmpanel');
      if(li===except||!b||!p)return;
      b.setAttribute('aria-expanded','false'); p.hidden=true;
    });
  }
  cats.forEach(function(li){
    var b=li.querySelector('button'), p=li.querySelector('.mmpanel');
    if(!b||!p)return;
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var open=b.getAttribute('aria-expanded')==='true';
      if(!mobile())closeAll(li);          // 데스크톱은 한 번에 하나만, 모바일 아코디언은 여러 개 허용
      b.setAttribute('aria-expanded',open?'false':'true'); p.hidden=open;
    });
  });
  // 드로어(모바일)
  if(toggle&&drawer){
    drawer.hidden=mobile();
    toggle.addEventListener('click',function(e){
      e.stopPropagation();
      var open=toggle.getAttribute('aria-expanded')==='true';
      toggle.setAttribute('aria-expanded',open?'false':'true');
      drawer.hidden=open; toggle.textContent=open?'☰':'✕';
      toggle.setAttribute('aria-label',open?'메뉴 열기':'메뉴 닫기');
    });
    // 폭이 바뀌면 드로어 상태를 그 폭의 기본값으로 되돌린다(데스크톱에서 hidden이 남으면 메뉴가 사라진다)
    var mq=matchMedia('(max-width:1100px)');
    (mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(function(){
      drawer.hidden=mobile();
      if(toggle){toggle.setAttribute('aria-expanded','false');toggle.textContent='☰';}
      closeAll(null);
    });
  }
  document.addEventListener('click',function(){ if(!mobile())closeAll(null); });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    closeAll(null);
    if(toggle&&toggle.getAttribute('aria-expanded')==='true'){
      toggle.setAttribute('aria-expanded','false');toggle.textContent='☰';
      if(drawer)drawer.hidden=true; toggle.focus();
    }
  });

  // ── 기준일 칩: data/asof.json 정본 하나만 읽는다(페이지마다 다른 날짜를 적지 않는다) ──
  function bdGap(d){
    var p=String(d||'').split('-'); if(p.length!==3)return 0;
    var x=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])), t=new Date(), n=0;
    var end=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());
    while(x.getTime()<end&&n<40){x.setUTCDate(x.getUTCDate()+1);var w=x.getUTCDay();if(w!==0&&w!==6)n++;}
    return n;
  }
  fetch('data/asof.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j||!j.primary)return;
    var el=document.getElementById('navasof'), v=document.getElementById('navasofv');
    if(!el||!v)return;
    v.textContent=j.primary; el.classList.add('ready');
    var n=bdGap(j.primary);
    if(n>=3){el.classList.add('stale');el.title='데이터가 '+n+'영업일 지연 — 자동갱신 확인 필요';}
    else{el.title='데이터 기준일 '+j.primary+' · 축별 기준일은 출처 페이지 참조';}
  }).catch(function(){});
})();
</script>

<main class="wrap wide" id="main">
  <nav class="crumb" aria-label="위치"><a href="index.html">여두 전략 랩</a> · 금리 분석</nav>
  <h1>금리 분석</h1>
  <div class="hardnote" id="hd">불러오는 중…</div>

  <section id="big"></section>

  <div class="chiprow" style="margin:10px 0 6px">
    <span class="fchip lbl">기간</span><span id="spans" style="display:contents"></span>
  </div>

  <section id="curve" style="margin-top:14px"></section>
  <section id="lv" style="margin-top:14px"></section>

  <section id="sens" style="margin-top:22px"></section>
  <section id="spike" style="margin-top:22px"></section>

  <details class="note" style="margin-top:14px">
    <summary><b>무엇을 보고 있나 · 한계</b></summary>
    <div id="limits" class="lim"></div>
  </details>
</main>
<style>
  .bigrow{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin:12px 0 0}
  .bigv{font-family:var(--mono);font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .bigl{font-size:12px;color:var(--muted);margin-bottom:4px}
  .dchip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:2px;padding:3px 8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .lgd{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px}
  .lgd i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 4px 0 10px;border-radius:2px}
  .lgd i:first-child{margin-left:0}
</style>
<script>
(function(){
  var el=function(i){return document.getElementById(i);};
  var esc=function(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var nf=function(v,d){return v==null||v!==v?'—':(+v).toFixed(d==null?2:d);};
  var sgn=function(v,d){return v==null||v!==v?'—':(v>0?'+':'')+(+v).toFixed(d==null?2:d);};
  var css=function(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';};
  var R=null, span=1260;
  // 계열 색 — 이 페이지 팔레트에 **정의된 이름만** 쓴다.
  // (2026-08-18 에 intraday.html 이 정의되지 않은 --good 을 11곳에서 써서 모든 양수가
  //  회색으로 그려지던 사고가 있었다. 같은 실수를 반복하지 않는다.)
  var COL={DGS3MO:'--muted',DGS2:'--marg',DGS10:'--accent',DGS30:'--hot',
           DFII10:'--deploy',T10YIE:'--marg',DFF:'--muted',
           MORTGAGE30US:'--hot',BAMLH0A0HYM2:'--hot'};

  // 선 그리기 한 벌 — 두 차트가 같은 것을 쓴다(두 벌 두면 한쪽만 고쳐진다).
  function line(cv,dates,series,keys,note){
    var W=cv.clientWidth||900,H=+cv.getAttribute('height'),dpr=window.devicePixelRatio||1;
    cv.width=W*dpr;cv.height=H*dpr;
    var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
    var n=dates.length,PT=10,PB=26,PL=42,PR=10;
    var vals=[];
    keys.forEach(function(k){(series[k]||[]).forEach(function(v){if(v!=null)vals.push(v);});});
    if(!vals.length)return;
    var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
    if(!(hi>lo))hi=lo+0.1;
    var pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
    var X=function(i){return PL+(W-PL-PR)*(n<2?0:i/(n-1));};
    var Y=function(v){return PT+(H-PT-PB)*(1-(v-lo)/(hi-lo));};
    x.font='11px ui-monospace,monospace';
    for(var g=0;g<=4;g++){
      var v=lo+(hi-lo)*g/4;
      x.strokeStyle=css('--line');x.globalAlpha=0.6;x.beginPath();
      x.moveTo(PL,Y(v));x.lineTo(W-PR,Y(v));x.stroke();x.globalAlpha=1;
      x.fillStyle=css('--muted');x.fillText(nf(v,2),4,Y(v)+4);
    }
    var lastY='';
    for(var i=0;i<n;i++){ var yy=dates[i].slice(0,4);
      if(yy!==lastY){ lastY=yy;
        if(i>0){ x.strokeStyle=css('--line');x.globalAlpha=0.5;x.beginPath();
          x.moveTo(X(i),PT);x.lineTo(X(i),H-PB+3);x.stroke();x.globalAlpha=1;
          x.fillStyle=css('--muted');x.fillText(yy,X(i)-14,H-PB+16);} } }
    keys.forEach(function(k){
      x.strokeStyle=css(COL[k]||'--ink');x.lineWidth=(k==='DGS10'?2.2:1.4);
      x.beginPath();var st=false;
      (series[k]||[]).forEach(function(v,i){ if(v==null)return;
        if(st)x.lineTo(X(i),Y(v));else{x.moveTo(X(i),Y(v));st=true;} });
      x.stroke();});
    cv.setAttribute('aria-label',note||'금리 곡선');
  }

  function slice(){ var k=R.dates.length-span; return k<0?0:k; }

  function drawBig(){
    var L={}; R.levels.forEach(function(r){L[r.k]=r;});
    var t=L.DGS10;
    el('big').innerHTML='<div class="card"><h3>미국 국채 10년<span class="hn">'+
      esc(t.d)+' · FRED</span></h3>'+
      '<div class="bigrow"><div><div class="bigl">현재</div><div class="bigv">'+nf(t.v,2)+'%</div></div>'+
      ['m1','m3','y1','y3'].map(function(k,i){
        var lab=['1개월','3개월','1년','3년'][i], v=t[k];
        return '<div><div class="bigl">'+lab+' 전 대비</div><span class="dchip" style="color:var('+
          ((v||0)>=0?'--hot':'--deploy')+')">'+(v==null?'—':sgn(v*100,0)+'bp')+'</span></div>';}).join('')+
      '</div>'+
      '<canvas id="c1" height="230" style="width:100%;margin-top:12px"></canvas>'+
      '<div class="lgd"><i style="background:var(--muted)"></i>3개월<i style="background:var(--marg)"></i>2년'+
      '<i style="background:var(--accent)"></i>10년<i style="background:var(--hot)"></i>30년</div></div>';
    var k=slice(), ds=R.dates.slice(k), se={};
    ['DGS3MO','DGS2','DGS10','DGS30'].forEach(function(c){se[c]=R.series[c].slice(k);});
    line(el('c1'),ds,se,['DGS3MO','DGS2','DGS10','DGS30'],'국채 금리 곡선');
  }

  function drawCurve(){
    var W=['now','m1','m3','y1'], LAB={now:'현재',m1:'1개월 전',m3:'3개월 전',y1:'1년 전'};
    var MAT={0.25:'3개월',2:'2년',10:'10년',30:'30년'};
    var rows=R.curve.now.map(function(p,i){
      return '<tr><td class="l">'+MAT[p.yrs]+'</td>'+
        W.map(function(w){var q=R.curve[w][i];return '<td>'+nf(q&&q.v,2)+'</td>';}).join('')+'</tr>';}).join('');
    var d3m=R.curve.now[0].v, d2=R.curve.now[1].v, d10=R.curve.now[2].v;
    el('curve').innerHTML='<div class="grid2">'+
      '<div class="card"><h3>수익률곡선<span class="hn">%</span></h3>'+
      '<canvas id="c2" height="170" style="width:100%"></canvas>'+
      '<div class="lgd"><i style="background:var(--accent)"></i>현재<i style="background:var(--marg)"></i>1개월 전'+
      '<i style="background:var(--muted)"></i>1년 전</div>'+
      '<div class="fswrap" style="margin-top:8px"><table class="tbl"><thead><tr><th class="l">만기</th>'+
      W.map(function(w){return '<th>'+LAB[w]+'</th>';}).join('')+'</tr></thead><tbody>'+rows+
      '</tbody></table></div>'+
      '<div class="lim" style="margin-top:6px">10Y−2Y <b>'+sgn((d10-d2)*100,0)+'bp</b> · '+
      '10Y−3M <b>'+sgn((d10-d3m)*100,0)+'bp</b> — 음수면 역전</div></div>'+
      '<div class="card"><h3>10년물 분해<span class="hn">실질 + 기대인플레</span></h3>'+
      '<canvas id="c3" height="170" style="width:100%"></canvas>'+
      '<div class="lgd"><i style="background:var(--deploy)"></i>실질(TIPS)'+
      '<i style="background:var(--marg)"></i>기대인플레<i style="background:var(--accent)"></i>명목 10년</div>'+
      '<div class="lim" style="margin-top:6px">명목 ≈ 실질 + 기대인플레. '+
      '어느 쪽이 올랐는지가 <b>같은 금리 상승도 다른 얘기</b>가 되게 한다.</div></div></div>';
    (function(){
      var cv=el('c2'),WW=cv.clientWidth||420,H=170,dpr=window.devicePixelRatio||1;
      cv.width=WW*dpr;cv.height=H*dpr;
      var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,WW,H);
      var all=[]; ['now','m1','y1'].forEach(function(w){
        R.curve[w].forEach(function(p){if(p.v!=null)all.push(p.v);});});
      if(!all.length)return;
      var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all); if(!(hi>lo))hi=lo+0.1;
      var pad=(hi-lo)*0.14; lo-=pad; hi+=pad;
      var PL=40,PR=10,PT=10,PB=24,N=R.curve.now.length;
      var X=function(i){return PL+(WW-PL-PR)*i/(N-1);};
      var Y=function(v){return PT+(H-PT-PB)*(1-(v-lo)/(hi-lo));};
      x.font='11px ui-monospace,monospace';
      for(var g=0;g<=3;g++){var v=lo+(hi-lo)*g/3;
        x.strokeStyle=css('--line');x.globalAlpha=0.6;x.beginPath();
        x.moveTo(PL,Y(v));x.lineTo(WW-PR,Y(v));x.stroke();x.globalAlpha=1;
        x.fillStyle=css('--muted');x.fillText(nf(v,1),4,Y(v)+4);}
      ['3M','2Y','10Y','30Y'].forEach(function(t,i){
        x.fillStyle=css('--muted');x.fillText(t,X(i)-8,H-6);});
      [['y1','--muted',1.2],['m1','--marg',1.4],['now','--accent',2.4]].forEach(function(w){
        x.strokeStyle=css(w[1]);x.lineWidth=w[2];x.beginPath();var st=false;
        R.curve[w[0]].forEach(function(p,i){ if(p.v==null)return;
          if(st)x.lineTo(X(i),Y(p.v)); else {x.moveTo(X(i),Y(p.v));st=true;}});
        x.stroke();});
      cv.setAttribute('aria-label','수익률곡선 현재·1개월 전·1년 전');
    })();
    var k=slice(), ds=R.dates.slice(k), se={};
    ['DFII10','T10YIE','DGS10'].forEach(function(c){se[c]=R.series[c].slice(k);});
    line(el('c3'),ds,se,['DFII10','T10YIE','DGS10'],'10년물 분해');
  }

  function drawLv(){
    var C={}; R.codes.forEach(function(c){C[c.k]=c;});
    var hy=C.BAMLH0A0HYM2;
    el('lv').innerHTML='<div class="card"><h3>금리 수준<span class="hn">변화는 bp</span></h3>'+
      '<div class="fswrap"><table class="tbl"><thead><tr>'+
      '<th class="l">계열</th><th>값</th><th>1개월</th><th>3개월</th><th>1년</th><th>3년</th><th>기준일</th>'+
      '</tr></thead><tbody>'+
      R.levels.map(function(r){
        var c=function(v){return '<td style="color:var('+((v||0)>=0?'--hot':'--deploy')+')">'+
          (v==null?'—':sgn(v*100,0))+'</td>';};
        return '<tr><td class="l">'+esc(r.nm)+'</td><td><b>'+nf(r.v,2)+'</b></td>'+
          c(r.m1)+c(r.m3)+c(r.y1)+c(r.y3)+
          '<td style="color:var(--muted)">'+esc(r.d)+'</td></tr>';}).join('')+
      '</tbody></table></div>'+
      '<div class="lim" style="margin-top:6px">붉은색=올랐다 · 초록=내렸다'+
      (hy&&hy.start?' · 하이일드는 FRED 제공 구간이 '+esc(hy.start)+'부터다':'')+'</div></div>';
  }

  function card(id,title,hn,head,rows,note){
    el(id).innerHTML='<div class="card"><h3>'+title+'<span class="hn">'+hn+'</span></h3>'+
      '<div class="fswrap"><table class="tbl"><thead><tr>'+head+'</tr></thead><tbody>'+rows+
      '</tbody></table></div><div class="lim" style="margin-top:6px">'+note+'</div></div>';
  }

  function drawSens(){
    var rows=(R.sens||[]).filter(function(r){return r.b_y1!=null;});
    if(!rows.length){el('sens').innerHTML='';return;}
    var c=function(v){return '<td style="color:var('+((v||0)>=0?'--deploy':'--hot')+')">'+
      (v==null?'—':sgn(v,2))+'</td>';};
    card('sens','금리 민감도','10년물이 +10bp 인 날 자산이 움직인 폭(%)',
      '<th class="l">자산</th><th>묶음</th><th>1년</th><th>t</th><th>R²</th><th>5년</th><th>전체</th>',
      rows.map(function(r){
        return '<tr><td class="l">'+esc(r.nm)+' <span style="color:var(--muted)">'+esc(r.t)+'</span></td>'+
          '<td style="color:var(--muted)">'+esc(r.cat)+'</td>'+
          c(r.b_y1)+'<td>'+nf(r.t_y1,1)+'</td><td>'+nf(r.r2_y1,2)+'</td>'+
          c(r.b_y5)+c(r.b_all)+'</tr>';}).join(''),
      '붉은색=금리가 오른 날 <b>내렸다</b>. t 는 Newey–West(5). '+
      '🚨 <b>같이 움직였다</b>는 뜻이지 <b>금리 때문</b>이라는 뜻이 아니다.');
  }

  function drawSpike(){
    var S=R.spike; if(!S||!S.rows||!S.rows.length){el('spike').innerHTML='';return;}
    card('spike','금리 급등일 성과','+'+nf(S.cut_bp,1)+'bp 이상인 '+S.n_days+'일 · '+esc(S.win),
      '<th class="l">자산</th><th>묶음</th><th>평균 %/일</th><th>표본</th>',
      S.rows.map(function(r){
        return '<tr><td class="l">'+esc(r.nm)+' <span style="color:var(--muted)">'+esc(r.t)+'</span></td>'+
          '<td style="color:var(--muted)">'+esc(r.cat)+'</td>'+
          '<td style="color:var('+((r.mean||0)>=0?'--deploy':'--hot')+')">'+sgn(r.mean,3)+'</td>'+
          '<td>'+r.n+'</td></tr>';}).join(''),
      '급등일만 골라 그날 수익을 평균했다. ⚠ <b>그날 하루</b>다 — 며칠에 걸친 반응은 안 잡힌다.');
  }

  function spans(){
    var w=el('spans'); w.innerHTML='';
    [['1년',252],['3년',756],['5년',1260],['10년',2520],['전체',99999]].forEach(function(p){
      var b=document.createElement('button');
      b.className='fchip';b.type='button';b.textContent=p[0];
      b.setAttribute('aria-pressed',String(span===p[1]));
      b.onclick=function(){span=p[1];spans();drawBig();drawCurve();};
      w.appendChild(b);});
  }

  fetch('data/rates.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(!j||!j.levels){el('hd').innerHTML='<b>불러오지 못했습니다</b> — <code>data/rates.json</code>이 아직 없습니다.';return;}
      R=j;
      el('hd').innerHTML='<b>'+esc(j.as_of)+'</b> 기준 · FRED'+
        '<span style="color:var(--muted)"> · 서술 통계, 예측 아님</span>';
      el('limits').innerHTML='· '+(j.limits||[]).map(function(x){
        return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}).join('<br>· ');
      spans(); drawBig(); drawCurve(); drawLv(); drawSens(); drawSpike();
    })
    .catch(function(){el('hd').innerHTML='<b>불러오지 못했습니다</b> — 네트워크 오류.';});
  window.addEventListener('resize',function(){ if(R){drawBig();drawCurve();} });
})();
</script>
